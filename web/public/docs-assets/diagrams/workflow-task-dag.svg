<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">工作流 DAG：一次代码重构</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">工作流 DAG：一次代码重构</text>
<rect class="box" x="60" y="220" width="160" height="62" rx="16"/>
<text class="label" x="140.0" y="257.3" text-anchor="middle" font-size="18">拉取仓库</text>
<rect class="box" x="280" y="220" width="180" height="62" rx="16"/>
<text class="label" x="370.0" y="257.3" text-anchor="middle" font-size="18">分析依赖</text>
<rect class="box" x="520" y="120" width="170" height="62" rx="16"/>
<text class="label" x="605.0" y="157.3" text-anchor="middle" font-size="18">静态检查</text>
<rect class="box" x="520" y="320" width="170" height="62" rx="16"/>
<text class="label" x="605.0" y="357.3" text-anchor="middle" font-size="18">单元测试</text>
<rect class="box" x="760" y="220" width="170" height="62" rx="16"/>
<text class="label" x="845.0" y="257.3" text-anchor="middle" font-size="18">重构代码</text>
<rect class="box hot" x="1000" y="220" width="180" height="62" rx="16"/>
<text class="label" x="1090.0" y="257.3" text-anchor="middle" font-size="18">人工审批</text>
<rect class="box hot" x="1000" y="400" width="180" height="62" rx="16"/>
<text class="label" x="1090.0" y="437.3" text-anchor="middle" font-size="18">合并</text>
<path class="edge" d="M220 251 L280 251" marker-end="url(#arrow)"/>
<path class="edge" d="M460 251 L520 151" marker-end="url(#arrow)"/>
<path class="edge" d="M460 251 L520 351" marker-end="url(#arrow)"/>
<path class="edge" d="M690 151 L760 235" marker-end="url(#arrow)"/>
<path class="edge" d="M690 351 L760 267" marker-end="url(#arrow)"/>
<path class="edge" d="M930 251 L1000 251" marker-end="url(#arrow)"/>
<path class="edge" d="M1090 282 L1090 400" marker-end="url(#arrow)"/>
<path class="accent-edge" d="M520 382 L760 282" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text class="tiny" x="640" y="400" text-anchor="start">测试失败 → 回到重构</text>
<text class="tiny" x="700" y="105" text-anchor="middle">并行</text>
<text class="tiny" x="60" y="560" text-anchor="start">DAG 的边表示依赖，不表示时间顺序；同一层的节点可以并行调度。</text>
</svg>
