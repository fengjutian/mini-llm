<text class="small" x="860.0" y="344" text-anchor="middle">0.11</text>
<text class="small" x="534" y="406" text-anchor="end">i₂</text>
<rect class="box" x="566" y="372" width="108" height="54" rx="10"/>
<text class="small" x="620.0" y="410" text-anchor="middle">0.07</text>
<rect class="box hot" x="686" y="372" width="108" height="54" rx="10"/>
<text class="small" x="740.0" y="410" text-anchor="middle">0.95</text>
<rect class="box" x="806" y="372" width="108" height="54" rx="10"/>
<text class="small" x="860.0" y="410" text-anchor="middle">0.05</text>
<text class="small" x="534" y="472" text-anchor="end">i₃</text>
<rect class="box" x="566" y="438" width="108" height="54" rx="10"/>
<text class="small" x="620.0" y="476" text-anchor="middle">0.12</text>
<rect class="box" x="686" y="438" width="108" height="54" rx="10"/>
<text class="small" x="740.0" y="476" text-anchor="middle">0.06</text>
<rect class="box hot" x="806" y="438" width="108" height="54" rx="10"/>
<text class="small" x="860.0" y="476" text-anchor="middle">0.90</text>
<text class="tiny" x="560" y="560" text-anchor="start">对角线：同一对（图片，文本）→ 相似度拉高</text>
<text class="tiny" x="560" y="590" text-anchor="start">非对角线：其他组合 → 相似度压低</text>
<text class="tiny" x="560" y="620" text-anchor="start">InfoNCE 就是在这个矩阵上做 softmax 交叉熵。</text>
</svg>
