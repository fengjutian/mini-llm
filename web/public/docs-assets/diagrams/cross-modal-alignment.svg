<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">跨模态对比对齐</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">跨模态对比对齐</text>
<rect class="box cool" x="90" y="250" width="210" height="90" rx="16"/>
<text class="label" x="195.0" y="301.3" text-anchor="middle" font-size="18">Image Encoder</text>
<rect class="box cool" x="1100" y="250" width="210" height="90" rx="16"/>
<text class="label" x="1205.0" y="301.3" text-anchor="middle" font-size="18">Text Encoder</text>
<path class="edge" d="M300 295 L380 295" marker-end="url(#arrow)"/>
<path class="edge" d="M1020 295 L1100 295" marker-end="url(#arrow)"/>
<text class="tiny" x="345" y="240" text-anchor="middle">图像向量</text>
<text class="tiny" x="1060" y="240" text-anchor="middle">文本向量</text>
<circle cx="430" cy="200" r="9" class="box cool"/>
<circle cx="930" cy="200" r="9" class="box cool"/>
<line class="accent-edge" x1="439" y1="200" x2="921" y2="200" stroke-width="3"/>
<text class="tiny" x="680" y="188" text-anchor="middle">正样本：拉近</text>
<text class="tiny" x="430" y="230" text-anchor="middle">猫的图片</text>
<text class="tiny" x="930" y="230" text-anchor="middle">“一只猫”</text>
<circle cx="430" cy="300" r="9" class="box cool"/>
<circle cx="930" cy="300" r="9" class="box cool"/>
<line class="accent-edge" x1="439" y1="300" x2="921" y2="300" stroke-width="3"/>
<text class="tiny" x="680" y="288" text-anchor="middle">正样本：拉近</text>
<text class="tiny" x="430" y="330" text-anchor="middle">狗的图片</text>
<text class="tiny" x="930" y="330" text-anchor="middle">“一只狗”</text>
<circle cx="430" cy="400" r="9" class="box cool"/>
<circle cx="930" cy="400" r="9" class="box cool"/>
<line class="accent-edge" x1="439" y1="400" x2="921" y2="400" stroke-width="3"/>
<text class="tiny" x="680" y="388" text-anchor="middle">正样本：拉近</text>
<text class="tiny" x="430" y="430" text-anchor="middle">车的图片</text>
<text class="tiny" x="930" y="430" text-anchor="middle">“一辆车”</text>
<line class="edge" x1="430" y1="200" x2="930" y2="300" stroke-dasharray="9 7"/>
<text class="small" x="700" y="470" text-anchor="middle">负样本：推远</text>
<text class="tiny" x="430" y="540" text-anchor="start">InfoNCE 损失：同一对（图片，文本）相似度越高，其余组合相似度越低。</text>
</svg>
