<text class="small" x="860.0" y="282" text-anchor="middle">t3</text>
<text class="small" x="534" y="340" text-anchor="end">i₁</text>
<rect class="box hot" x="566" y="306" width="108" height="54" rx="10"/>
<text class="small" x="620.0" y="344" text-anchor="middle">0.92</text>
