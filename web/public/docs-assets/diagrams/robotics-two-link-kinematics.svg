<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="t d"><title id="t">二自由度机械臂正逆运动学</title><desc id="d">两连杆、关节角、末端坐标、可达区域和肘上肘下两个逆解。</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="currentColor"/></marker></defs><style>.b{fill:#f7f4ed}.g{stroke:#c4bdb1;opacity:.5}.ax{stroke:#69777d;stroke-width:3;marker-end:url(#a)}.l1{stroke:#3178a5;stroke-width:18}.l2{stroke:#e45d32;stroke-width:18}.gh{fill:none;stroke:#e45d32;stroke-width:7;stroke-dasharray:12 9}.j{fill:#fffdf8;stroke:#172126;stroke-width:5}.r{fill:#3178a5;opacity:.08;stroke:#3178a5}.tx{fill:#172126;font:600 18px Inter,"Microsoft YaHei",sans-serif}.sm{fill:#69777d;font:16px Inter,"Microsoft YaHei",sans-serif}.m{fill:#172126;font:21px Cambria,serif}.p{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}@media(prefers-color-scheme:dark){.b{fill:#101416}.g{stroke:#3c484e}.j,.p{fill:#182024}.tx,.m{fill:#edf2f3}.sm{fill:#a8b4b9}}</style>
<rect class="b" width="1400" height="700" rx="24"/><text class="tx" x="60" y="58" font-size="30">同一个末端点，可能对应多个关节解</text><circle class="r" cx="150" cy="560" r="410"/><path class="ax" d="M150 560H810M150 560V110"/><path class="l1" d="M150 560L430 330"/><path class="l2" d="M430 330L700 230"/><path class="gh" d="M150 560L455 480L700 230"/><g class="j"><circle cx="150" cy="560" r="18"/><circle cx="430" cy="330" r="15"/><circle cx="455" cy="480" r="13"/><circle cx="700" cy="230" r="18"/></g><text class="tx" x="305" y="410">L₁</text><text class="tx" x="560" y="260">L₂</text><text class="m" x="715" y="220">P(x, y)</text><text class="sm" x="370" y="300">肘上解</text><text class="sm" x="470" y="515">肘下解</text>
<rect class="p" x="850" y="115" width="490" height="470" rx="20"/><text class="tx" x="890" y="170" font-size="23">正向运动学（FK）</text><text class="m" x="890" y="215">x = L₁ cos θ₁ + L₂ cos(θ₁+θ₂)</text><text class="m" x="890" y="255">y = L₁ sin θ₁ + L₂ sin(θ₁+θ₂)</text><path class="g" d="M890 295H1300"/><text class="tx" x="890" y="345" font-size="23">逆向运动学（IK）</text><text class="m" x="890" y="390">cos θ₂ = (x²+y²−L₁²−L₂²)/(2L₁L₂)</text><text class="m" x="890" y="435">θ₂ = ± arccos(…)</text><text class="sm" x="890" y="485">± 产生肘上 / 肘下两组候选解</text><text class="sm" x="890" y="525">再按关节限位、碰撞和当前姿态筛选</text></svg>
