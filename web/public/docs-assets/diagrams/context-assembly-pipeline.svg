<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Context Assembly 流水线</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">Context Assembly 流水线</text>
<rect class="box" x="70" y="120" width="230" height="62" rx="16"/>
<text class="label" x="185.0" y="157.3" text-anchor="middle" font-size="18">System Prompt</text>
<path class="edge" d="M300 151 L390 300" marker-end="url(#arrow)"/>
<rect class="box" x="70" y="204" width="230" height="62" rx="16"/>
<text class="label" x="185.0" y="241.3" text-anchor="middle" font-size="18">Memory</text>
<path class="edge" d="M300 235 L390 300" marker-end="url(#arrow)"/>
<rect class="box" x="70" y="288" width="230" height="62" rx="16"/>
<text class="label" x="185.0" y="325.3" text-anchor="middle" font-size="18">RAG 检索</text>
<path class="edge" d="M300 319 L390 300" marker-end="url(#arrow)"/>
<rect class="box" x="70" y="372" width="230" height="62" rx="16"/>
<text class="label" x="185.0" y="409.3" text-anchor="middle" font-size="18">Tool 结果</text>
<path class="edge" d="M300 403 L390 300" marker-end="url(#arrow)"/>
<rect class="box" x="70" y="456" width="230" height="62" rx="16"/>
<text class="label" x="185.0" y="493.3" text-anchor="middle" font-size="18">对话历史</text>
<path class="edge" d="M300 487 L390 300" marker-end="url(#arrow)"/>
<rect class="box cool" x="390" y="210" width="200" height="180" rx="16"/>
<text class="label" x="490.0" y="296.0" text-anchor="middle" font-size="18">打分与去重</text>
<text class="small" x="490.0" y="322.0" text-anchor="middle">相关性 / 时效 / 冗余</text>
<rect class="box hot" x="640" y="210" width="190" height="180" rx="16"/>
<text class="label" x="735.0" y="296.0" text-anchor="middle" font-size="18">预算裁剪</text>
<text class="small" x="735.0" y="322.0" text-anchor="middle">按窗口与任务分配</text>
<rect class="box good" x="880" y="210" width="230" height="180" rx="16"/>
<text class="label" x="995.0" y="296.0" text-anchor="middle" font-size="18">组装 Prompt</text>
<text class="small" x="995.0" y="322.0" text-anchor="middle">顺序影响注意力</text>
<rect class="box" x="1160" y="240" width="160" height="120" rx="16"/>
<text class="label" x="1240.0" y="306.3" text-anchor="middle" font-size="18">Model</text>
<path class="edge" d="M590 300 L640 300" marker-end="url(#arrow)"/>
<path class="edge" d="M830 300 L880 300" marker-end="url(#arrow)"/>
<path class="edge" d="M1110 300 L1160 300" marker-end="url(#arrow)"/>
<text class="tiny" x="70" y="590" text-anchor="start">上下文不是“把能找到的都塞进去”，而是一次有预算的检索与排序。</text>
</svg>
