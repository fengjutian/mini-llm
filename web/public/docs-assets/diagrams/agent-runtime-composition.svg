<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Runtime 不是一个 while 循环</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">Runtime 不是一个 while 循环</text>
<rect class="box hot" x="590" y="120" width="220" height="56" rx="16"/>
<text class="label" x="700.0" y="154.3" text-anchor="middle" font-size="18">Agent</text>
<path class="edge" d="M700 176 L700 214" marker-end="url(#arrow)"/>
<rect class="box hot" x="520" y="214" width="360" height="64" rx="16"/>
<text class="label" x="700.0" y="253.0" text-anchor="middle" font-size="20">Runtime</text>
<rect class="box cool" x="180" y="340" width="320" height="60" rx="16"/>
<text class="label" x="340.0" y="375.25" text-anchor="middle" font-size="15">Model Gateway</text>
<path class="edge" d="M700 278 L340 340" marker-end="url(#arrow)"/>
<rect class="box cool" x="540" y="340" width="320" height="60" rx="16"/>
<text class="label" x="700.0" y="375.25" text-anchor="middle" font-size="15">Tool Registry</text>
<path class="edge" d="M700 278 L700 340" marker-end="url(#arrow)"/>
<rect class="box cool" x="900" y="340" width="320" height="60" rx="16"/>
<text class="label" x="1060.0" y="375.25" text-anchor="middle" font-size="15">Executor</text>
<path class="edge" d="M700 278 L1060 340" marker-end="url(#arrow)"/>
<rect class="box cool" x="180" y="430" width="320" height="60" rx="16"/>
<text class="label" x="340.0" y="465.25" text-anchor="middle" font-size="15">Sandbox</text>
<path class="edge" d="M700 278 L340 430" marker-end="url(#arrow)"/>
<rect class="box cool" x="540" y="430" width="320" height="60" rx="16"/>
<text class="label" x="700.0" y="465.25" text-anchor="middle" font-size="15">State Manager</text>
<path class="edge" d="M700 278 L700 430" marker-end="url(#arrow)"/>
<rect class="box cool" x="900" y="430" width="320" height="60" rx="16"/>
<text class="label" x="1060.0" y="465.25" text-anchor="middle" font-size="15">Scheduler</text>
<path class="edge" d="M700 278 L1060 430" marker-end="url(#arrow)"/>
<text class="tiny" x="70" y="600" text-anchor="start">Runtime 负责“怎么安全地跑”，Executor 只负责“跑一次”。</text>
