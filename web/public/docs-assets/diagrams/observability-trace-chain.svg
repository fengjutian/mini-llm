<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">一次请求穿过哪些组件</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">一次请求穿过哪些组件</text>
<rect class="box" x="600" y="130" width="220" height="58" rx="16"/>
<text class="label" x="710.0" y="165.3" text-anchor="middle" font-size="18">用户请求</text>
<path class="edge" d="M710 188 L710 218" marker-end="url(#arrow)"/>
<rect class="box cool" x="600" y="218" width="220" height="58" rx="16"/>
<text class="label" x="710.0" y="253.3" text-anchor="middle" font-size="18">Agent Engine</text>
<path class="edge" d="M710 276 L710 306" marker-end="url(#arrow)"/>
<rect class="box cool" x="600" y="306" width="220" height="58" rx="16"/>
<text class="label" x="710.0" y="341.3" text-anchor="middle" font-size="18">Meta-Controller</text>
<path class="edge" d="M710 364 L710 394" marker-end="url(#arrow)"/>
<rect class="box hot" x="600" y="394" width="220" height="58" rx="16"/>
<text class="label" x="710.0" y="429.3" text-anchor="middle" font-size="18">Runtime Engine</text>
<rect class="box" x="90" y="500" width="260" height="54" rx="16"/>
<text class="label" x="220.0" y="532.25" text-anchor="middle" font-size="15">Model Engine</text>
<path class="edge" d="M710 474 L220 500" marker-end="url(#arrow)"/>
<rect class="box" x="400" y="500" width="260" height="54" rx="16"/>
<text class="label" x="530.0" y="532.25" text-anchor="middle" font-size="15">Memory Engine</text>
<path class="edge" d="M710 474 L530 500" marker-end="url(#arrow)"/>
<rect class="box" x="710" y="500" width="260" height="54" rx="16"/>
<text class="label" x="840.0" y="532.25" text-anchor="middle" font-size="15">Tool Engine</text>
<path class="edge" d="M710 474 L840 500" marker-end="url(#arrow)"/>
<rect class="box" x="1020" y="500" width="260" height="54" rx="16"/>
<text class="label" x="1150.0" y="532.25" text-anchor="middle" font-size="15">Evaluation Engine</text>
<path class="edge" d="M710 474 L1150 500" marker-end="url(#arrow)"/>
<text class="tiny" x="70" y="610" text-anchor="start">Trace 是端到端的：入口一次请求，下面所有组件调用都是它的 span。</text>
</svg>
