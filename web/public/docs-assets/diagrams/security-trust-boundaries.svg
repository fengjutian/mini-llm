  </style><rect class="bg" width="1400" height="650" rx="24"/><text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text><text class="title" x="64" y="105">纵深防御与 Trust Boundary</text><rect x="100" y="155" width="1200" height="390" rx="34" fill="none" stroke="#e45d32" stroke-width="4"/><rect x="250" y="220" width="900" height="270" rx="30" fill="none" stroke="#3178a5" stroke-width="4"/><rect x="430" y="285" width="540" height="140" rx="26" fill="none" stroke="#4f8b62" stroke-width="4"/><rect class="box good" x="540" y="320" width="320" height="70" rx="16"/><text class="label" x="700" y="362" text-anchor="middle">Sandboxed Execution</text><text class="label" x="125" y="195">Identity + Authentication</text><text class="label" x="275" y="260">Authorization + Policy</text><text class="label" x="455" y="315">Capability Boundary</text><text class="small" x="1040" y="520">外部输入默认不可信</text></svg>