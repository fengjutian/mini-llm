<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Experience Replay：旧经验要反复用</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">Experience Replay：旧经验要反复用</text>
<rect class="box hot" x="80" y="250" width="260" height="90" rx="16"/>
<text class="label" x="210.0" y="291.0" text-anchor="middle" font-size="18">Replay Buffer</text>
<text class="small" x="210.0" y="317.0" text-anchor="middle">轨迹 / 状态 / 动作 / 回报</text>
<rect class="box cool" x="420" y="180" width="220" height="64" rx="16"/>
<text class="label" x="530.0" y="218.3" text-anchor="middle" font-size="18">Sample 1</text>
<path class="edge" d="M340 295 L420 212" marker-end="url(#arrow)"/>
<rect class="box cool" x="420" y="290" width="220" height="64" rx="16"/>
<text class="label" x="530.0" y="328.3" text-anchor="middle" font-size="18">Sample 2</text>
<path class="edge" d="M340 295 L420 322" marker-end="url(#arrow)"/>
<rect class="box cool" x="420" y="400" width="220" height="64" rx="16"/>
<text class="label" x="530.0" y="438.3" text-anchor="middle" font-size="18">Sample 3</text>
<path class="edge" d="M340 295 L420 432" marker-end="url(#arrow)"/>
<rect class="box" x="740" y="250" width="240" height="90" rx="16"/>
<text class="label" x="860.0" y="291.0" text-anchor="middle" font-size="18">Mini-batch</text>
<text class="small" x="860.0" y="317.0" text-anchor="middle">混合新旧经验</text>
<path class="edge" d="M640 212 L740 285" marker-end="url(#arrow)"/>
<path class="edge" d="M640 322 L740 290" marker-end="url(#arrow)"/>
<path class="edge" d="M640 432 L740 295" marker-end="url(#arrow)"/>
<rect class="box good" x="1060" y="250" width="240" height="90" rx="16"/>
<text class="label" x="1180.0" y="301.3" text-anchor="middle" font-size="18">Policy Update</text>
<path class="edge" d="M980 295 L1060 295" marker-end="url(#arrow)"/>
<path class="accent-edge" d="M1180 340 L1180 430 L210 430 L210 340" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text class="tiny" x="560" y="460" text-anchor="start">新经验写回 Buffer</text>
<text class="tiny" x="80" y="560" text-anchor="start">只用最新经验会“学了新的忘了旧的”；回放让数据分布更稳定。</text>
</svg>
