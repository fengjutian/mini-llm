<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">三种解码策略的搜索形状</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">三种解码策略的搜索形状</text>
<rect class="box" x="70" y="150" width="400" height="400" rx="20"/>
<text class="label" x="94" y="190" text-anchor="start" font-size="20">Greedy</text>
<text class="tiny" x="94" y="218" text-anchor="start">每步取 argmax</text>
<rect class="box" x="500" y="150" width="400" height="400" rx="20"/>
<text class="label" x="524" y="190" text-anchor="start" font-size="20">Beam k=2</text>
<text class="tiny" x="524" y="218" text-anchor="start">保留 k 条候选</text>
<rect class="box" x="930" y="150" width="400" height="400" rx="20"/>
<text class="label" x="954" y="190" text-anchor="start" font-size="20">Sampling</text>
<text class="tiny" x="954" y="218" text-anchor="start">按概率分布抽样</text>
<rect class="box hot" x="200" y="260" width="120" height="44" rx="16"/>
<text class="label" x="260.0" y="286.9" text-anchor="middle" font-size="14">t1</text>
<path class="edge" d="M260 304 L260 330" marker-end="url(#arrow)"/>
<rect class="box hot" x="200" y="330" width="120" height="44" rx="16"/>
<text class="label" x="260.0" y="356.9" text-anchor="middle" font-size="14">t2</text>
<path class="edge" d="M260 374 L260 400" marker-end="url(#arrow)"/>
<rect class="box hot" x="200" y="400" width="120" height="44" rx="16"/>
<text class="label" x="260.0" y="426.9" text-anchor="middle" font-size="14">t3</text>
<path class="edge" d="M260 444 L260 470" marker-end="url(#arrow)"/>
<rect class="box hot" x="200" y="470" width="120" height="44" rx="16"/>
<text class="label" x="260.0" y="496.9" text-anchor="middle" font-size="14">t4</text>
<rect class="box hot" x="600" y="270" width="120" height="44" rx="16"/>
<text class="label" x="660.0" y="296.9" text-anchor="middle" font-size="14">A</text>
<rect class="box cool" x="760" y="270" width="120" height="44" rx="16"/>
<text class="label" x="820.0" y="296.9" text-anchor="middle" font-size="14">B</text>
<rect class="box hot" x="600" y="370" width="120" height="44" rx="16"/>
<text class="label" x="660.0" y="396.9" text-anchor="middle" font-size="14">A1</text>
<rect class="box cool" x="760" y="370" width="120" height="44" rx="16"/>
<text class="label" x="820.0" y="396.9" text-anchor="middle" font-size="14">B1</text>
<rect class="box hot" x="600" y="470" width="120" height="44" rx="16"/>
<text class="label" x="660.0" y="496.9" text-anchor="middle" font-size="14">A2</text>
<rect class="box cool" x="760" y="470" width="120" height="44" rx="16"/>
<text class="label" x="820.0" y="496.9" text-anchor="middle" font-size="14">B2</text>
<path class="edge" d="M660 314 L660 370" marker-end="url(#arrow)"/>
<path class="edge" d="M820 314 L820 370" marker-end="url(#arrow)"/>
<path class="edge" d="M660 314 L760 370" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<path class="edge" d="M820 314 L720 370" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<path class="edge" d="M660 414 L660 470" marker-end="url(#arrow)"/>
<path class="edge" d="M820 414 L820 470" marker-end="url(#arrow)"/>
<text class="tiny" x="660" y="540" text-anchor="start">交叉扩展后按总分保留 2 条</text>
<rect class="box hot" x="1030" y="250" width="200" height="50" rx="16"/>
<text class="label" x="1130.0" y="279.55" text-anchor="middle" font-size="13">p(token | context)</text>
<rect class="box hot" x="940" y="420" width="110" height="50" rx="16"/>
<text class="label" x="995.0" y="449.9" text-anchor="middle" font-size="14">A</text>
<path class="edge" d="M1130 300 L995 420" marker-end="url(#arrow)"/>
<text class="tiny" x="1070.5" y="375" text-anchor="start">p=0.6</text>
<rect class="box cool" x="1080" y="420" width="110" height="50" rx="16"/>
<text class="label" x="1135.0" y="449.9" text-anchor="middle" font-size="14">B</text>
<path class="edge" d="M1130 300 L1135 420" marker-end="url(#arrow)"/>
<text class="tiny" x="1140.5" y="375" text-anchor="start">p=0.3</text>
<rect class="box cool" x="1200" y="420" width="110" height="50" rx="16"/>
<text class="label" x="1255.0" y="449.9" text-anchor="middle" font-size="14">C</text>
<path class="edge" d="M1130 300 L1255 420" marker-end="url(#arrow)"/>
<text class="tiny" x="1200.5" y="375" text-anchor="start">p=0.1</text>
<text class="tiny" x="70" y="600" text-anchor="start">Greedy 最快但会重复，Beam 更稳但更贵，Sampling 更有多样性但不可复现。</text>
</svg>
