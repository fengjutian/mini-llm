<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">一次请求的 Span 树</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">一次请求的 Span 树</text>
<rect class="box hot" x="70" y="320" width="250" height="68" rx="16"/>
<text class="label" x="195.0" y="359.6" text-anchor="middle" font-size="16">Span 1 · agent.execute</text>
<line class="axis" x1="340" y1="200" x2="340" y2="530"/>
<line class="axis" x1="320" y1="354" x2="340" y2="354"/>
<line class="axis" x1="340" y1="198" x2="380" y2="198"/>
<rect class="box" x="380" y="176" width="320" height="46" rx="16"/>
<text class="label" x="540.0" y="203.9" text-anchor="middle" font-size="14">Span 2 · agent.plan</text>
<line class="axis" x1="340" y1="258" x2="380" y2="258"/>
<rect class="box cool" x="380" y="236" width="320" height="46" rx="16"/>
<text class="label" x="540.0" y="263.9" text-anchor="middle" font-size="14">Span 3 · memory.retrieve</text>
<line class="axis" x1="340" y1="318" x2="380" y2="318"/>
<rect class="box" x="380" y="296" width="320" height="46" rx="16"/>
<text class="label" x="540.0" y="323.9" text-anchor="middle" font-size="14">Span 4 · model.generate</text>
<line class="axis" x1="340" y1="378" x2="380" y2="378"/>
<rect class="box cool" x="380" y="356" width="320" height="46" rx="16"/>
<text class="label" x="540.0" y="383.9" text-anchor="middle" font-size="14">Span 5 · tool.github_search</text>
<line class="axis" x1="340" y1="438" x2="380" y2="438"/>
<rect class="box" x="380" y="416" width="320" height="46" rx="16"/>
<text class="label" x="540.0" y="443.9" text-anchor="middle" font-size="14">Span 6 · model.analyze</text>
<line class="axis" x1="340" y1="498" x2="380" y2="498"/>
<rect class="box cool" x="380" y="476" width="320" height="46" rx="16"/>
<text class="label" x="540.0" y="503.9" text-anchor="middle" font-size="14">Span 7 · agent.evaluate</text>
<text class="tiny" x="70" y="560" text-anchor="start">trace_id 是同一请求的“主线”，parent_span_id 决定谁挂在谁下面。</text>
<text class="tiny" x="70" y="600" text-anchor="start">没有父子关系的 span 只能算日志，不能算链路。</text>
</svg>
