<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Agent 任务的状态机</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">Agent 任务的状态机</text>
<rect class="box cool" x="80" y="280" width="200" height="60" rx="16"/>
<text class="label" x="180.0" y="315.6" text-anchor="middle" font-size="16">CREATED</text>
<rect class="box hot" x="380" y="280" width="200" height="60" rx="16"/>
<text class="label" x="480.0" y="315.6" text-anchor="middle" font-size="16">RUNNING</text>
<rect class="box cool" x="700" y="150" width="240" height="56" rx="16"/>
<text class="label" x="820.0" y="183.25" text-anchor="middle" font-size="15">WAITING_TOOL</text>
<rect class="box cool" x="700" y="226" width="240" height="56" rx="16"/>
<text class="label" x="820.0" y="259.25" text-anchor="middle" font-size="15">WAITING_APPROVAL</text>
<rect class="box" x="700" y="302" width="240" height="56" rx="16"/>
<text class="label" x="820.0" y="335.25" text-anchor="middle" font-size="15">PAUSED</text>
<rect class="box hot" x="700" y="378" width="240" height="56" rx="16"/>
<text class="label" x="820.0" y="411.25" text-anchor="middle" font-size="15">FAILED</text>
<rect class="box good" x="1050" y="280" width="220" height="60" rx="16"/>
<text class="label" x="1160.0" y="315.6" text-anchor="middle" font-size="16">COMPLETED</text>
<path class="edge" d="M280 310 L380 310" marker-end="url(#arrow)"/>
<path class="edge" d="M580 310 L700 178" marker-end="url(#arrow)"/>
<path class="edge" d="M580 310 L700 254" marker-end="url(#arrow)"/>
<path class="edge" d="M580 310 L700 330" marker-end="url(#arrow)"/>
<path class="edge" d="M580 310 L700 406" marker-end="url(#arrow)"/>
<path class="edge" d="M940 178 L1050 300" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<path class="edge" d="M940 254 L1050 310" marker-end="url(#arrow)"/>
<path class="edge" d="M940 406 L1050 320" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text class="tiny" x="70" y="520" text-anchor="start">所有状态都要能持久化：进程重启后，从最后提交的状态继续。</text>
</svg>
