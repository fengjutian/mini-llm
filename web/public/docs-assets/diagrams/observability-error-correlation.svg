<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">错误关联的七个维度</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">错误关联的七个维度</text>
<rect class="box hot" x="570" y="130" width="220" height="60" rx="16"/>
<text class="label" x="680.0" y="167.0" text-anchor="middle" font-size="20">Error</text>
<rect class="box cool" x="80" y="300" width="260" height="60" rx="16"/>
<text class="label" x="210.0" y="336.3" text-anchor="middle" font-size="18">Trace</text>
<path class="edge" d="M680 190 L210 300" marker-end="url(#arrow)"/>
<rect class="box cool" x="400" y="300" width="260" height="60" rx="16"/>
<text class="label" x="530.0" y="336.3" text-anchor="middle" font-size="18">Span</text>
<path class="edge" d="M680 190 L530 300" marker-end="url(#arrow)"/>
<rect class="box cool" x="720" y="300" width="260" height="60" rx="16"/>
<text class="label" x="850.0" y="336.3" text-anchor="middle" font-size="18">Task</text>
<path class="edge" d="M680 190 L850 300" marker-end="url(#arrow)"/>
<rect class="box cool" x="1040" y="300" width="260" height="60" rx="16"/>
<text class="label" x="1170.0" y="336.3" text-anchor="middle" font-size="18">Agent</text>
<path class="edge" d="M680 190 L1170 300" marker-end="url(#arrow)"/>
<rect class="box" x="80" y="400" width="260" height="60" rx="16"/>
<text class="label" x="210.0" y="436.3" text-anchor="middle" font-size="18">Model</text>
<path class="edge" d="M680 190 L210 400" marker-end="url(#arrow)"/>
<rect class="box" x="400" y="400" width="260" height="60" rx="16"/>
<text class="label" x="530.0" y="436.3" text-anchor="middle" font-size="18">Tool</text>
<path class="edge" d="M680 190 L530 400" marker-end="url(#arrow)"/>
<rect class="box" x="720" y="400" width="260" height="60" rx="16"/>
<text class="label" x="850.0" y="436.3" text-anchor="middle" font-size="18">Runtime</text>
<path class="edge" d="M680 190 L850 400" marker-end="url(#arrow)"/>
<text class="tiny" x="70" y="560" text-anchor="start">错误必须能回答：哪个 trace、哪个 span、哪个工具、哪个模型版本。</text>
<text class="tiny" x="70" y="600" text-anchor="start">缺一个维度，排查就会退化成“重启试试”。</text>
</svg>
