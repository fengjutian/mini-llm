<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">多模态编码器与统一表示</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">多模态编码器与统一表示</text>
<rect class="box hot" x="80" y="150" width="190" height="64" rx="16"/>
<text class="label" x="175.0" y="188.3" text-anchor="middle" font-size="18">Image</text>
<rect class="box cool" x="360" y="150" width="200" height="64" rx="16"/>
<text class="label" x="460.0" y="188.3" text-anchor="middle" font-size="18">Image Encoder</text>
<path class="edge" d="M270 182 L360 182" marker-end="url(#arrow)"/>
<path class="edge" d="M560 182 L650 320" marker-end="url(#arrow)"/>
<rect class="box" x="80" y="250" width="190" height="64" rx="16"/>
<text class="label" x="175.0" y="288.3" text-anchor="middle" font-size="18">Audio</text>
<rect class="box cool" x="360" y="250" width="200" height="64" rx="16"/>
<text class="label" x="460.0" y="288.3" text-anchor="middle" font-size="18">Audio Encoder</text>
<path class="edge" d="M270 282 L360 282" marker-end="url(#arrow)"/>
<path class="edge" d="M560 282 L650 320" marker-end="url(#arrow)"/>
<rect class="box" x="80" y="350" width="190" height="64" rx="16"/>
<text class="label" x="175.0" y="388.3" text-anchor="middle" font-size="18">Video</text>
<rect class="box cool" x="360" y="350" width="200" height="64" rx="16"/>
<text class="label" x="460.0" y="388.3" text-anchor="middle" font-size="18">Video Encoder</text>
<path class="edge" d="M270 382 L360 382" marker-end="url(#arrow)"/>
<path class="edge" d="M560 382 L650 320" marker-end="url(#arrow)"/>
<rect class="box" x="80" y="450" width="190" height="64" rx="16"/>
<text class="label" x="175.0" y="488.3" text-anchor="middle" font-size="18">Spatial</text>
<rect class="box cool" x="360" y="450" width="200" height="64" rx="16"/>
<text class="label" x="460.0" y="488.3" text-anchor="middle" font-size="18">Spatial Encoder</text>
<path class="edge" d="M270 482 L360 482" marker-end="url(#arrow)"/>
<path class="edge" d="M560 482 L650 320" marker-end="url(#arrow)"/>
<rect class="box good" x="650" y="220" width="200" height="200" rx="16"/>
<text class="label" x="750.0" y="316.0" text-anchor="middle" font-size="18">Projector / Adapter</text>
<text class="small" x="750.0" y="342.0" text-anchor="middle">把各模态映射到同一维度</text>
<path class="accent-edge" d="M850 320 L950 320" marker-end="url(#arrow)"/>
<rect class="box hot" x="950" y="230" width="250" height="180" rx="16"/>
<text class="label" x="1075.0" y="316.0" text-anchor="middle" font-size="18">Multimodal LLM</text>
<text class="small" x="1075.0" y="342.0" text-anchor="middle">跨模态对齐、融合与推理</text>
<rect class="box good" x="1140" y="460" width="170" height="70" rx="16"/>
<text class="label" x="1225.0" y="501.3" text-anchor="middle" font-size="18">Output</text>
<path class="edge" d="M1075 410 L1180 460" marker-end="url(#arrow)"/>
<text class="tiny" x="80" y="580" text-anchor="start">不同模态先各自编码，再用投影层对齐到语言模型可以消费的表示空间。</text>
</svg>
