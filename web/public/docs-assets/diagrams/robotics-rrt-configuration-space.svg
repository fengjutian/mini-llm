<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="t d"><title id="t">配置空间中的 RRT</title><desc id="d">关节配置空间中的碰撞区域、探索树和无碰撞路径。</desc><style>.b{fill:#f7f4ed}.p{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.o{fill:#d7d0c5;stroke:#69777d;stroke-width:3}.tr{fill:none;stroke:#83a7b9;stroke-width:2}.pa{fill:none;stroke:#e45d32;stroke-width:9}.n{fill:#3178a5}.s{fill:#4f8b62}.go{fill:#e45d32}.tx{fill:#172126;font:600 18px Inter,"Microsoft YaHei",sans-serif}.sm{fill:#69777d;font:16px Inter,"Microsoft YaHei",sans-serif}@media(prefers-color-scheme:dark){.b{fill:#101416}.p{fill:#182024}.o{fill:#3d464a}.tx{fill:#edf2f3}.sm{fill:#a8b4b9}}</style><rect class="b" width="1400" height="700" rx="24"/><text class="tx" x="60" y="58" font-size="30">RRT 在关节配置空间中绕开碰撞区域</text><rect class="p" x="90" y="100" width="900" height="530" rx="12"/><path class="o" d="M405 100L580 100L640 230L535 315L360 260Z"/><path class="o" d="M595 390L815 335L905 460L770 605L585 550Z"/><text class="sm" x="425" y="180">碰撞配置</text><text class="sm" x="680" y="465">碰撞配置</text>
<path class="tr" d="M170 555L255 495L330 530L360 440L285 385L370 345L465 375L525 335L605 315L675 265L755 295L845 230L915 165M255 495L215 425L150 385M360 440L450 465L515 425M285 385L235 310M370 345L325 285M525 335L495 270M605 315L645 360M675 265L665 200L740 165M755 295L825 325M845 230L785 210"/><path class="pa" d="M170 555L255 495L360 440L370 345L525 335L605 315L675 265L755 295L845 230L915 165"/><circle class="s" cx="170" cy="555" r="15"/><circle class="go" cx="915" cy="165" r="15"/><text class="tx" x="115" y="595">q_start</text><text class="tx" x="920" y="145">q_goal</text><text class="tx" x="455" y="675">关节角 θ₁ →</text><text class="tx" x="35" y="385" transform="rotate(-90 35 385)">关节角 θ₂ →</text>
<rect class="p" x="1045" y="140" width="295" height="400" rx="18"/><text class="tx" x="1080" y="190">一次迭代</text><text class="sm" x="1080" y="240">1. 随机采样 q_rand</text><text class="sm" x="1080" y="285">2. 找最近节点 q_near</text><text class="sm" x="1080" y="330">3. 向样本扩展 q_new</text><text class="sm" x="1080" y="375">4. 检查边是否碰撞</text><text class="sm" x="1080" y="420">5. 无碰撞则加入树</text><text class="sm" x="1080" y="485">红线：回溯得到的路径</text></svg>
