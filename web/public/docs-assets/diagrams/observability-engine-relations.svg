<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Observability 与各 Engine 的关系</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">Observability 与各 Engine 的关系</text>
<rect class="box hot" x="560" y="100" width="280" height="56" rx="16"/>
<text class="label" x="700.0" y="133.6" text-anchor="middle" font-size="16">User Task</text>
<path class="edge" d="M700 156 L700 180" marker-end="url(#arrow)"/>
<rect class="box cool" x="560" y="180" width="280" height="56" rx="16"/>
<text class="label" x="700.0" y="213.6" text-anchor="middle" font-size="16">Agent Engine</text>
<path class="edge" d="M700 236 L700 260" marker-end="url(#arrow)"/>
<rect class="box cool" x="560" y="260" width="280" height="56" rx="16"/>
<text class="label" x="700.0" y="293.6" text-anchor="middle" font-size="16">Meta-Controller</text>
<path class="edge" d="M700 316 L700 340" marker-end="url(#arrow)"/>
<rect class="box cool" x="560" y="340" width="280" height="56" rx="16"/>
<text class="label" x="700.0" y="373.6" text-anchor="middle" font-size="16">Runtime</text>
<rect class="box" x="560" y="420" width="280" height="56" rx="16"/>
<text class="label" x="700.0" y="452.9" text-anchor="middle" font-size="14">Model / Memory / Tools</text>
<path class="edge" d="M700 396 L700 420" marker-end="url(#arrow)"/>
<path class="edge" d="M700 476 L700 500" marker-end="url(#arrow)"/>
<rect class="box hot" x="560" y="500" width="280" height="56" rx="16"/>
<text class="label" x="700.0" y="533.6" text-anchor="middle" font-size="16">Observability</text>
<line class="axis" x1="700" y1="556" x2="700" y2="576"/>
<line class="axis" x1="180" y1="576" x2="1220" y2="576"/>
<path class="edge" d="M180 576 L180 600" marker-end="url(#arrow)"/>
<rect class="box good" x="80" y="600" width="200" height="44" rx="16"/>
<text class="label" x="180.0" y="627.25" text-anchor="middle" font-size="15">Evaluation</text>
<path class="edge" d="M460 576 L460 600" marker-end="url(#arrow)"/>
<rect class="box good" x="360" y="600" width="200" height="44" rx="16"/>
<text class="label" x="460.0" y="627.25" text-anchor="middle" font-size="15">Cost</text>
<path class="edge" d="M740 576 L740 600" marker-end="url(#arrow)"/>
<rect class="box good" x="640" y="600" width="200" height="44" rx="16"/>
<text class="label" x="740.0" y="627.25" text-anchor="middle" font-size="15">Replay</text>
<path class="edge" d="M1020 576 L1020 600" marker-end="url(#arrow)"/>
<rect class="box cool" x="920" y="600" width="200" height="44" rx="16"/>
<text class="label" x="1020.0" y="627.25" text-anchor="middle" font-size="15">Learning</text>
<text class="tiny" x="70" y="200" text-anchor="start">每个 Engine 都是数据源，也都是 Observability 的使用者。</text>
</svg>
