<text class="small" x="450" y="464" text-anchor="start">· Audit</text>
<path class="edge" d="M690 484 L690 512" marker-end="url(#arrow)"/>
<rect class="box cool" x="560" y="512" width="260" height="52" rx="16"/>
<text class="label" x="690.0" y="543.6" text-anchor="middle" font-size="16">Tool Executor</text>
<path class="edge" d="M690 564 L690 592" marker-end="url(#arrow)"/>
<rect class="box" x="560" y="592" width="260" height="46" rx="16"/>
<text class="label" x="690.0" y="620.25" text-anchor="middle" font-size="15">External System</text>
<text class="tiny" x="70" y="620" text-anchor="start"></text>
</svg>
