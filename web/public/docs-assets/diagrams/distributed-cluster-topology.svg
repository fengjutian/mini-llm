<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">分布式 Agent 集群拓扑</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">分布式 Agent 集群拓扑</text>
<rect class="box" x="60" y="280" width="150" height="70" rx="16"/>
<text class="label" x="135.0" y="321.3" text-anchor="middle" font-size="18">Client</text>
<rect class="box" x="250" y="280" width="170" height="70" rx="16"/>
<text class="label" x="335.0" y="321.3" text-anchor="middle" font-size="18">Gateway</text>
<rect class="box hot" x="460" y="280" width="190" height="70" rx="16"/>
<text class="label" x="555.0" y="321.3" text-anchor="middle" font-size="18">Scheduler</text>
<rect class="box cool" x="700" y="160" width="170" height="66" rx="16"/>
<text class="label" x="785.0" y="199.3" text-anchor="middle" font-size="18">Worker A</text>
<rect class="box cool" x="700" y="270" width="170" height="66" rx="16"/>
<text class="label" x="785.0" y="309.3" text-anchor="middle" font-size="18">Worker B</text>
<rect class="box cool" x="700" y="380" width="170" height="66" rx="16"/>
<text class="label" x="785.0" y="419.3" text-anchor="middle" font-size="18">Worker C</text>
<rect class="box good" x="950" y="280" width="200" height="80" rx="16"/>
<text class="label" x="1050.0" y="316.0" text-anchor="middle" font-size="18">State Store</text>
<text class="small" x="1050.0" y="342.0" text-anchor="middle">checkpoint / lease</text>
<path class="edge" d="M210 315 L250 315" marker-end="url(#arrow)"/>
<path class="edge" d="M420 315 L460 315" marker-end="url(#arrow)"/>
<path class="edge" d="M650 315 L700 193" marker-end="url(#arrow)"/>
<path class="edge" d="M870 193 L950 315" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<path class="edge" d="M650 315 L700 303" marker-end="url(#arrow)"/>
<path class="edge" d="M870 303 L950 315" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<path class="edge" d="M650 315 L700 413" marker-end="url(#arrow)"/>
<path class="edge" d="M870 413 L950 315" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<path class="edge" d="M950 350 L650 345" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text class="tiny" x="880" y="380" text-anchor="start">心跳 / 租约</text>
<text class="tiny" x="60" y="560" text-anchor="start">调度器只做决策，Worker 只做执行，状态放在外部存储里——三者可以独立扩缩容。</text>
</svg>
