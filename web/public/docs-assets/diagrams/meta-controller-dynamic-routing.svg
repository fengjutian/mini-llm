<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">动态路由：按任务与成本选模型</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">动态路由：按任务与成本选模型</text>
<rect class="box" x="80" y="160" width="240" height="56" rx="16"/>
<text class="label" x="200.0" y="193.25" text-anchor="middle" font-size="15">任务复杂度</text>
<path class="edge" d="M320 188 L440 320" marker-end="url(#arrow)"/>
<rect class="box" x="80" y="240" width="240" height="56" rx="16"/>
<text class="label" x="200.0" y="273.25" text-anchor="middle" font-size="15">预算</text>
<path class="edge" d="M320 268 L440 320" marker-end="url(#arrow)"/>
<rect class="box" x="80" y="320" width="240" height="56" rx="16"/>
<text class="label" x="200.0" y="353.25" text-anchor="middle" font-size="15">延迟要求</text>
<path class="edge" d="M320 348 L440 320" marker-end="url(#arrow)"/>
<rect class="box" x="80" y="400" width="240" height="56" rx="16"/>
<text class="label" x="200.0" y="433.25" text-anchor="middle" font-size="15">历史成功率</text>
<path class="edge" d="M320 428 L440 320" marker-end="url(#arrow)"/>
<rect class="box hot" x="440" y="280" width="240" height="80" rx="16"/>
<text class="label" x="560.0" y="316.0" text-anchor="middle" font-size="18">Router</text>
<text class="small" x="560.0" y="342.0" text-anchor="middle">分类 / 打分</text>
<rect class="box cool" x="780" y="160" width="220" height="56" rx="16"/>
<text class="label" x="890.0" y="193.6" text-anchor="middle" font-size="16">Small Model</text>
<path class="edge" d="M680 320 L780 188" marker-end="url(#arrow)"/>
<rect class="box cool" x="780" y="280" width="220" height="56" rx="16"/>
<text class="label" x="890.0" y="313.6" text-anchor="middle" font-size="16">Medium Model</text>
<path class="edge" d="M680 320 L780 308" marker-end="url(#arrow)"/>
<rect class="box cool" x="780" y="400" width="220" height="56" rx="16"/>
<text class="label" x="890.0" y="433.6" text-anchor="middle" font-size="16">Large Model</text>
<path class="edge" d="M680 320 L780 428" marker-end="url(#arrow)"/>
<path class="edge" d="M890 456 L890 500 L560 500 L560 360" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text class="tiny" x="600" y="530" text-anchor="start">失败或置信度不足 → 升级到更大的模型</text>
<text class="tiny" x="80" y="600" text-anchor="start">路由的目标不是“总用最强模型”，而是让每次调用的性价比最高。</text>
</svg>
