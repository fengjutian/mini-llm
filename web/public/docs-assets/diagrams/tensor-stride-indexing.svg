<text class="small" x="445" y="362" text-anchor="middle">(2,3)</text>
<text class="tiny" x="100" y="130" text-anchor="start">逻辑视图 3 × 4（row-major，stride = (4, 1)）</text>
<rect class="box hot" x="620" y="190" width="320" height="110" rx="16"/>
<text class="label" x="780.0" y="241.0" text-anchor="middle" font-size="18">offset = i × 4 + j</text>
<text class="small" x="780.0" y="267.0" text-anchor="middle">stride = (4, 1)</text>
<path class="edge" d="M520 260 L620 250" marker-end="url(#arrow)"/>
