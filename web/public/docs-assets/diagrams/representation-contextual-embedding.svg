<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">同一个词，不同的上下文向量</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">同一个词，不同的上下文向量</text>
<rect class="box cool" x="100" y="150" width="160" height="56" rx="16"/>
<text class="label" x="180.0" y="183.25" text-anchor="middle" font-size="15">The</text>
<path class="edge" d="M180 206 L180 260" marker-end="url(#arrow)"/>
<rect class="box hot" x="290" y="150" width="160" height="56" rx="16"/>
<text class="label" x="370.0" y="183.25" text-anchor="middle" font-size="15">bank</text>
<path class="edge" d="M370 206 L370 260" marker-end="url(#arrow)"/>
<rect class="box cool" x="480" y="150" width="160" height="56" rx="16"/>
<text class="label" x="560.0" y="183.25" text-anchor="middle" font-size="15">of</text>
<path class="edge" d="M560 206 L560 260" marker-end="url(#arrow)"/>
<rect class="box cool" x="670" y="150" width="160" height="56" rx="16"/>
<text class="label" x="750.0" y="183.25" text-anchor="middle" font-size="15">the</text>
<path class="edge" d="M750 206 L750 260" marker-end="url(#arrow)"/>
<rect class="box cool" x="860" y="150" width="160" height="56" rx="16"/>
<text class="label" x="940.0" y="183.25" text-anchor="middle" font-size="15">river</text>
<path class="edge" d="M940 206 L940 260" marker-end="url(#arrow)"/>
<rect class="box cool" x="120" y="260" width="1140" height="70" rx="16"/>
<text class="label" x="690.0" y="300.6" text-anchor="middle" font-size="16">Token Embedding（静态向量，同一个词相同）</text>
<path class="edge" d="M690 330 L690 390" marker-end="url(#arrow)"/>
<rect class="box hot" x="120" y="390" width="1140" height="80" rx="16"/>
<text class="label" x="690.0" y="435.6" text-anchor="middle" font-size="16">Transformer Layers：每层都混入上下文</text>
<path class="edge" d="M690 470 L690 520" marker-end="url(#arrow)"/>
<rect class="box good" x="120" y="520" width="540" height="80" rx="16"/>
<text class="label" x="390.0" y="565.6" text-anchor="middle" font-size="16">bank ≈ 河岸</text>
<rect class="box good" x="720" y="520" width="540" height="80" rx="16"/>
<text class="label" x="990.0" y="565.6" text-anchor="middle" font-size="16">bank ≈ 银行（在别的句子里）</text>
<text class="tiny" x="80" y="640" text-anchor="start">静态 Embedding 只编码词本身；上下文向量才编码“这一次它是什么意思”。</text>
</svg>
