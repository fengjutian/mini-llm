<path class="edge" d="M780 320 L860 320" marker-end="url(#arrow)"/>
<path class="edge" d="M1020 320 L1100 320" marker-end="url(#arrow)"/>
<text class="tiny" x="70" y="580" text-anchor="start">先对齐再融合：对齐解决“同一个语义”，融合解决“如何共同决策”。</text>
