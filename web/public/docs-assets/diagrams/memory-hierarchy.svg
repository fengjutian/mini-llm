<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">记忆层级与巩固过程</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>
    :root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}
    @media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}
  </style><rect class="bg" width="1400" height="650" rx="24"/><text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text><text class="title" x="64" y="105">记忆层级与巩固过程</text><rect class="box hot" x="80" y="250" width="210" height="80" rx="16"/><text class="label" x="185" y="297" text-anchor="middle">Working Memory</text><rect class="box cool" x="410" y="170" width="220" height="80" rx="16"/><text class="label" x="520" y="217" text-anchor="middle">Episodic Memory</text><rect class="box cool" x="410" y="350" width="220" height="80" rx="16"/><text class="label" x="520" y="397" text-anchor="middle">Semantic Memory</text><rect class="box normal" x="790" y="250" width="220" height="80" rx="16"/><text class="label" x="900" y="297" text-anchor="middle">Consolidation</text><rect class="box good" x="1120" y="250" width="210" height="80" rx="16"/><text class="label" x="1225" y="297" text-anchor="middle">Long-term Store</text><path class="edge" d="M290 290 L410 210" marker-end="url(#arrow)"/><path class="edge" d="M290 290 L410 390" marker-end="url(#arrow)"/><path class="edge" d="M630 210 L790 280" marker-end="url(#arrow)"/><path class="edge" d="M630 390 L790 300" marker-end="url(#arrow)"/><path class="accent-edge" d="M1010 290 L1120 290" marker-end="url(#arrow)"/><path class="edge" d="M1120 320 L300 330" marker-end="url(#arrow)"/><text class="small" x="650" y="150">经历</text><text class="small" x="650" y="450">抽象知识</text><text class="small" x="640" y="365">Recall / Retrieval</text></svg>