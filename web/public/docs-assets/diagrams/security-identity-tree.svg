<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">身份是分层的，不是单一的</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">身份是分层的，不是单一的</text>
<rect class="box hot" x="560" y="120" width="220" height="54" rx="16"/>
<text class="label" x="670.0" y="153.3" text-anchor="middle" font-size="18">User</text>
<path class="edge" d="M670 174 L670 210" marker-end="url(#arrow)"/>
<rect class="box cool" x="560" y="210" width="220" height="54" rx="16"/>
<text class="label" x="670.0" y="243.3" text-anchor="middle" font-size="18">Agent A</text>
<line class="axis" x1="670" y1="264" x2="670" y2="300"/>
<line class="axis" x1="360" y1="300" x2="980" y2="300"/>
<path class="edge" d="M360 300 L360 340" marker-end="url(#arrow)"/>
<rect class="box" x="230" y="340" width="260" height="50" rx="16"/>
<text class="label" x="360.0" y="369.9" text-anchor="middle" font-size="14">Model: model-001</text>
<path class="edge" d="M980 300 L980 340" marker-end="url(#arrow)"/>
<rect class="box" x="850" y="340" width="260" height="50" rx="16"/>
<text class="label" x="980.0" y="369.9" text-anchor="middle" font-size="14">Tool: github.read</text>
<path class="edge" d="M670 300 L670 400" marker-end="url(#arrow)"/>
<rect class="box cool" x="560" y="400" width="220" height="54" rx="16"/>
<text class="label" x="670.0" y="432.95" text-anchor="middle" font-size="17">Sub-Agent B</text>
<line class="axis" x1="670" y1="454" x2="670" y2="480"/>
<line class="axis" x1="430" y1="480" x2="910" y2="480"/>
<path class="edge" d="M430 480 L430 510" marker-end="url(#arrow)"/>
<rect class="box" x="290" y="510" width="280" height="50" rx="16"/>
<text class="label" x="430.0" y="539.55" text-anchor="middle" font-size="13">Model: model-002</text>
<path class="edge" d="M910 480 L910 510" marker-end="url(#arrow)"/>
<rect class="box" x="770" y="510" width="280" height="50" rx="16"/>
<text class="label" x="910.0" y="539.55" text-anchor="middle" font-size="13">Tool: filesystem.read</text>
<text class="tiny" x="70" y="615" text-anchor="start">每个 Agent 都应有独立身份；子 Agent 不能继承父 Agent 的全部权限。</text>
</svg>
