<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Transformer Stack：从 Token 到 Logits</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">Transformer Stack：从 Token 到 Logits</text>
<rect class="box cool" x="520" y="130" width="360" height="54" rx="16"/>
<text class="label" x="700.0" y="162.95" text-anchor="middle" font-size="17">Token IDs</text>
<path class="edge" d="M700 184 L700 198" marker-end="url(#arrow)"/>
<rect class="box cool" x="520" y="198" width="360" height="54" rx="16"/>
<text class="label" x="700.0" y="230.95" text-anchor="middle" font-size="17">Embedding</text>
<path class="edge" d="M700 252 L700 266" marker-end="url(#arrow)"/>
<rect class="box cool" x="520" y="266" width="360" height="54" rx="16"/>
<text class="label" x="700.0" y="298.95" text-anchor="middle" font-size="17">+ Position Encoding</text>
<path class="edge" d="M700 320 L700 334" marker-end="url(#arrow)"/>
<rect class="box hot" x="520" y="334" width="360" height="54" rx="16"/>
<text class="label" x="700.0" y="366.95" text-anchor="middle" font-size="17">Transformer Block × N</text>
<path class="edge" d="M700 388 L700 402" marker-end="url(#arrow)"/>
<rect class="box" x="520" y="402" width="360" height="54" rx="16"/>
<text class="label" x="700.0" y="434.95" text-anchor="middle" font-size="17">Final Norm</text>
<path class="edge" d="M700 456 L700 470" marker-end="url(#arrow)"/>
<rect class="box" x="520" y="470" width="360" height="54" rx="16"/>
<text class="label" x="700.0" y="502.95" text-anchor="middle" font-size="17">LM Head</text>
<path class="edge" d="M700 524 L700 538" marker-end="url(#arrow)"/>
<rect class="box good" x="520" y="538" width="360" height="54" rx="16"/>
<text class="label" x="700.0" y="570.95" text-anchor="middle" font-size="17">Logits</text>
<text class="tiny" x="900" y="160" text-anchor="start">N = 12 / 24 / 32 …</text>
<text class="tiny" x="900" y="190" text-anchor="start">层数决定容量，也决定显存与延迟。</text>
<text class="tiny" x="70" y="620" text-anchor="start">每一层都是“同样的 Block，不同的权重”；堆叠本身就是一种容量扩展方式。</text>
</svg>
