<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">三维表示的六种选择</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">三维表示的六种选择</text>
<rect class="box cool" x="90" y="170" width="380" height="170" rx="16"/>
<text class="label" x="280.0" y="261.3" text-anchor="middle" font-size="18">Point Cloud</text>
<text class="small" x="114" y="258" text-anchor="start">无序点集 P = {p₁ … p_N}</text>
<text class="tiny" x="114" y="292" text-anchor="start">用途：感知、配准</text>
<rect class="box cool" x="510" y="170" width="380" height="170" rx="16"/>
<text class="label" x="700.0" y="261.3" text-anchor="middle" font-size="18">Voxel</text>
<text class="small" x="534" y="258" text-anchor="start">规则网格，占据/密度</text>
<text class="tiny" x="534" y="292" text-anchor="start">用途：碰撞检测</text>
<rect class="box cool" x="930" y="170" width="380" height="170" rx="16"/>
<text class="label" x="1120.0" y="261.3" text-anchor="middle" font-size="18">Mesh</text>
<text class="small" x="954" y="258" text-anchor="start">显式三角面片</text>
<text class="tiny" x="954" y="292" text-anchor="start">用途：建模、仿真</text>
<rect class="box" x="90" y="380" width="380" height="170" rx="16"/>
<text class="label" x="280.0" y="471.3" text-anchor="middle" font-size="18">SDF</text>
<text class="small" x="114" y="468" text-anchor="start">隐式距离场 f(x) = d</text>
<text class="tiny" x="114" y="502" text-anchor="start">用途：碰撞距离、优化</text>
<rect class="box" x="510" y="380" width="380" height="170" rx="16"/>
<text class="label" x="700.0" y="471.3" text-anchor="middle" font-size="18">NeRF / 3DGS</text>
<text class="small" x="534" y="468" text-anchor="start">可微渲染，新视角合成</text>
<text class="tiny" x="534" y="502" text-anchor="start">用途：场景重建</text>
<rect class="box" x="930" y="380" width="380" height="170" rx="16"/>
<text class="label" x="1120.0" y="471.3" text-anchor="middle" font-size="18">Scene Graph</text>
<text class="small" x="954" y="468" text-anchor="start">对象 + 空间关系</text>
<text class="tiny" x="954" y="502" text-anchor="start">用途：语义推理</text>
<text class="tiny" x="90" y="590" text-anchor="start">没有一种表示能同时满足渲染、碰撞和语义推理，工程上通常组合使用。</text>
</svg>
