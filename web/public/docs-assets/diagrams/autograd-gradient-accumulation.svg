<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">梯度累积：小显存训大 batch</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">梯度累积：小显存训大 batch</text>
<rect class="box cool" x="90" y="150" width="240" height="64" rx="16"/>
<text class="label" x="210.0" y="187.25" text-anchor="middle" font-size="15">Micro-batch 1</text>
<rect class="box" x="400" y="150" width="200" height="64" rx="16"/>
<text class="label" x="500.0" y="186.55" text-anchor="middle" font-size="13">forward + backward</text>
<path class="edge" d="M330 182 L400 182" marker-end="url(#arrow)"/>
<path class="edge" d="M600 182 L700 182" marker-end="url(#arrow)"/>
<rect class="box cool" x="90" y="250" width="240" height="64" rx="16"/>
<text class="label" x="210.0" y="287.25" text-anchor="middle" font-size="15">Micro-batch 2</text>
<rect class="box" x="400" y="250" width="200" height="64" rx="16"/>
<text class="label" x="500.0" y="286.55" text-anchor="middle" font-size="13">forward + backward</text>
<path class="edge" d="M330 282 L400 282" marker-end="url(#arrow)"/>
<path class="edge" d="M600 282 L700 282" marker-end="url(#arrow)"/>
<rect class="box cool" x="90" y="350" width="240" height="64" rx="16"/>
<text class="label" x="210.0" y="387.25" text-anchor="middle" font-size="15">Micro-batch 3</text>
<rect class="box" x="400" y="350" width="200" height="64" rx="16"/>
<text class="label" x="500.0" y="386.55" text-anchor="middle" font-size="13">forward + backward</text>
<path class="edge" d="M330 382 L400 382" marker-end="url(#arrow)"/>
<path class="edge" d="M600 382 L700 382" marker-end="url(#arrow)"/>
<rect class="box cool" x="90" y="450" width="240" height="64" rx="16"/>
<text class="label" x="210.0" y="487.25" text-anchor="middle" font-size="15">Micro-batch 4</text>
<rect class="box" x="400" y="450" width="200" height="64" rx="16"/>
<text class="label" x="500.0" y="486.55" text-anchor="middle" font-size="13">forward + backward</text>
<path class="edge" d="M330 482 L400 482" marker-end="url(#arrow)"/>
<path class="edge" d="M600 482 L700 482" marker-end="url(#arrow)"/>
<rect class="box hot" x="700" y="250" width="200" height="180" rx="16"/>
<text class="label" x="800.0" y="336.0" text-anchor="middle" font-size="18">Gradient Buffer</text>
<text class="small" x="800.0" y="362.0" text-anchor="middle">累加 4 次</text>
<path class="accent-edge" d="M900 340 L980 340" marker-end="url(#arrow)"/>
<rect class="box good" x="980" y="300" width="240" height="80" rx="16"/>
<text class="label" x="1100.0" y="336.0" text-anchor="middle" font-size="18">Optimizer.step()</text>
<text class="small" x="1100.0" y="362.0" text-anchor="middle">每 4 次执行一次</text>
<text class="tiny" x="90" y="600" text-anchor="start">等效 batch = micro_batch × accumulation；显存只与 micro_batch 有关。</text>
</svg>
