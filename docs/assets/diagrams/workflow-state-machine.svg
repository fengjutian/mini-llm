<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">长任务的状态机</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">长任务的状态机</text>
<rect class="box" x="70" y="280" width="170" height="70" rx="16"/>
<text class="label" x="155.0" y="321.3" text-anchor="middle" font-size="18">PENDING</text>
<rect class="box hot" x="300" y="280" width="170" height="70" rx="16"/>
<text class="label" x="385.0" y="321.3" text-anchor="middle" font-size="18">RUNNING</text>
<rect class="box hot" x="560" y="150" width="220" height="70" rx="16"/>
<text class="label" x="670.0" y="191.3" text-anchor="middle" font-size="18">WAITING_APPROVAL</text>
<rect class="box" x="560" y="330" width="160" height="70" rx="16"/>
<text class="label" x="640.0" y="371.3" text-anchor="middle" font-size="18">FAILED</text>
<rect class="box good" x="880" y="150" width="190" height="70" rx="16"/>
<text class="label" x="975.0" y="191.3" text-anchor="middle" font-size="18">COMPLETED</text>
<rect class="box" x="880" y="400" width="200" height="70" rx="16"/>
<text class="label" x="980.0" y="441.3" text-anchor="middle" font-size="18">COMPENSATING</text>
<rect class="box" x="1150" y="400" width="170" height="70" rx="16"/>
<text class="label" x="1235.0" y="441.3" text-anchor="middle" font-size="18">RETRYING</text>
<path class="edge" d="M240 315 L300 315" marker-end="url(#arrow)"/>
<path class="edge" d="M470 300 L560 190" marker-end="url(#arrow)"/>
<path class="edge" d="M470 335 L560 360" marker-end="url(#arrow)"/>
<path class="edge" d="M780 185 L880 185" marker-end="url(#arrow)"/>
<path class="edge" d="M670 220 L600 280" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text class="tiny" x="600" y="250" text-anchor="start">驳回</text>
<path class="edge" d="M640 400 L880 430" marker-end="url(#arrow)"/>
<path class="edge" d="M1080 435 L1150 435" marker-end="url(#arrow)"/>
<path class="edge" d="M1235 400 L1180 350 L470 300" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text class="tiny" x="760" y="300" text-anchor="start">重试成功</text>
<text class="tiny" x="70" y="560" text-anchor="start">状态必须可持久化：进程重启后，从最后提交的状态继续，而不是从头再来。</text>
</svg>
