<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">分层 Agent：Orchestrator → Planner → Executor</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">分层 Agent：Orchestrator → Planner → Executor</text>
<rect class="box hot" x="540" y="140" width="320" height="72" rx="16"/>
<text class="label" x="700.0" y="183.0" text-anchor="middle" font-size="20">Orchestrator</text>
<rect class="box cool" x="300" y="270" width="260" height="68" rx="16"/>
<text class="label" x="430.0" y="310.3" text-anchor="middle" font-size="18">Planner A</text>
<rect class="box cool" x="840" y="270" width="260" height="68" rx="16"/>
<text class="label" x="970.0" y="310.3" text-anchor="middle" font-size="18">Planner B</text>
<rect class="box good" x="90" y="400" width="250" height="66" rx="16"/>
<text class="label" x="215.0" y="439.3" text-anchor="middle" font-size="18">Executor 1</text>
<rect class="box good" x="410" y="400" width="250" height="66" rx="16"/>
<text class="label" x="535.0" y="439.3" text-anchor="middle" font-size="18">Executor 2</text>
<rect class="box good" x="730" y="400" width="250" height="66" rx="16"/>
<text class="label" x="855.0" y="439.3" text-anchor="middle" font-size="18">Executor 3</text>
<rect class="box good" x="1050" y="400" width="250" height="66" rx="16"/>
<text class="label" x="1175.0" y="439.3" text-anchor="middle" font-size="18">Executor 4</text>
<path class="edge" d="M700 212 L560 270" marker-end="url(#arrow)"/>
<path class="edge" d="M700 212 L970 270" marker-end="url(#arrow)"/>
<path class="edge" d="M430 338 L300 400" marker-end="url(#arrow)"/>
<path class="edge" d="M430 338 L730 400" marker-end="url(#arrow)"/>
<path class="edge" d="M970 338 L980 400" marker-end="url(#arrow)"/>
<path class="edge" d="M970 338 L1150 400" marker-end="url(#arrow)"/>
<path class="accent-edge" d="M1210 400 L1345 400 L1345 212 L860 212" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text class="tiny" x="1225" y="380" text-anchor="start">升级 / 失败上报</text>
<text class="tiny" x="90" y="560" text-anchor="start">分层的意义不是“多一层”，而是让每层只处理自己粒度的决策。</text>
</svg>
