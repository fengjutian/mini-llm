<text class="small" x="90" y="548" text-anchor="start">· Validation</text>
<rect class="box" x="400" y="380" width="300" height="210" rx="16"/>
<text class="label" x="420" y="418" text-anchor="start" font-size="18">Runtime</text>
<text class="small" x="420" y="458" text-anchor="start">· Scheduler</text>
<text class="small" x="420" y="488" text-anchor="start">· Coordinator</text>
<text class="small" x="420" y="518" text-anchor="start">· Feedback</text>
<text class="small" x="420" y="548" text-anchor="start">· Replanning</text>
<rect class="box hot" x="730" y="380" width="300" height="210" rx="16"/>
<text class="label" x="750" y="418" text-anchor="start" font-size="18">Safety</text>
<text class="small" x="750" y="458" text-anchor="start">· Joint Limit</text>
<text class="small" x="750" y="488" text-anchor="start">· Velocity</text>
<text class="small" x="750" y="518" text-anchor="start">· Collision</text>
<text class="small" x="750" y="548" text-anchor="start">· E-Stop</text>
<rect class="box" x="1060" y="380" width="300" height="210" rx="16"/>
<text class="label" x="1080" y="418" text-anchor="start" font-size="18">Evaluation</text>
<text class="small" x="1080" y="458" text-anchor="start">· Success Rate</text>
<text class="small" x="1080" y="488" text-anchor="start">· Quality</text>
<text class="small" x="1080" y="518" text-anchor="start">· Latency</text>
<text class="small" x="1080" y="548" text-anchor="start">· Failure</text>
<text class="tiny" x="70" y="620" text-anchor="start">从感知到动作再到安全校验，VLA 的每一层都可以单独替换与评估。</text>
</svg>
