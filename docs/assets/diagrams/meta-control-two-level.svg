<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">元控制的双层结构</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">元控制的双层结构</text>
<rect class="box hot" x="80" y="140" width="1240" height="130" rx="20"/>
<text class="label" x="110" y="180" text-anchor="start" font-size="20">Meta-Level 元控制层</text>
<rect class="box hot" x="560" y="170" width="170" height="66" rx="16"/>
<text class="label" x="645.0" y="208.6" text-anchor="middle" font-size="16">任务分析</text>
<rect class="box hot" x="750" y="170" width="170" height="66" rx="16"/>
<text class="label" x="835.0" y="208.6" text-anchor="middle" font-size="16">模型选择</text>
<rect class="box hot" x="940" y="170" width="170" height="66" rx="16"/>
<text class="label" x="1025.0" y="208.6" text-anchor="middle" font-size="16">预算分配</text>
<rect class="box hot" x="1130" y="170" width="170" height="66" rx="16"/>
<text class="label" x="1215.0" y="208.6" text-anchor="middle" font-size="16">停止判断</text>
<rect class="box cool" x="80" y="420" width="1240" height="130" rx="20"/>
<text class="label" x="110" y="460" text-anchor="start" font-size="20">Object-Level 执行层</text>
<rect class="box cool" x="560" y="450" width="170" height="66" rx="16"/>
<text class="label" x="645.0" y="488.6" text-anchor="middle" font-size="16">规划</text>
<rect class="box cool" x="750" y="450" width="170" height="66" rx="16"/>
<text class="label" x="835.0" y="488.6" text-anchor="middle" font-size="16">行动</text>
<rect class="box cool" x="940" y="450" width="170" height="66" rx="16"/>
<text class="label" x="1025.0" y="488.6" text-anchor="middle" font-size="16">观察</text>
<rect class="box cool" x="1130" y="450" width="170" height="66" rx="16"/>
<text class="label" x="1215.0" y="488.6" text-anchor="middle" font-size="16">验证</text>
<path class="accent-edge" d="M500 300 L500 400" marker-end="url(#arrow)"/>
<text class="tiny" x="515" y="355" text-anchor="start">策略 / 预算 / 停止条件</text>
<path class="edge" d="M900 400 L900 300" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text class="tiny" x="915" y="360" text-anchor="start">结果 / 置信度 / 成本</text>
<text class="tiny" x="90" y="600" text-anchor="start">元层不直接干活，它决定“谁、用什么、花多少、什么时候停”。</text>
</svg>
