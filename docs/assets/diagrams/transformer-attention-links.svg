<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Self-Attention：每个 Token 都能看到其他 Token</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">Self-Attention：每个 Token 都能看到其他 Token</text>
<rect class="box" x="120" y="140" width="150" height="48" rx="16"/>
<text class="label" x="195.0" y="169.25" text-anchor="middle" font-size="15">小明</text>
<path class="edge" d="M270 164 L600 320" marker-end="url(#arrow)"/>
<rect class="box" x="120" y="206" width="150" height="48" rx="16"/>
<text class="label" x="195.0" y="235.25" text-anchor="middle" font-size="15">把</text>
<path class="edge" d="M270 230 L600 320" marker-end="url(#arrow)"/>
<rect class="box hot" x="120" y="272" width="150" height="48" rx="16"/>
<text class="label" x="195.0" y="301.25" text-anchor="middle" font-size="15">苹果</text>
<path class="edge" d="M270 296 L600 320" marker-end="url(#arrow)"/>
<rect class="box" x="120" y="338" width="150" height="48" rx="16"/>
<text class="label" x="195.0" y="367.25" text-anchor="middle" font-size="15">放到</text>
<path class="edge" d="M270 362 L600 320" marker-end="url(#arrow)"/>
<rect class="box" x="120" y="404" width="150" height="48" rx="16"/>
<text class="label" x="195.0" y="433.25" text-anchor="middle" font-size="15">桌子</text>
<path class="edge" d="M270 428 L600 320" marker-end="url(#arrow)"/>
<rect class="box hot" x="120" y="470" width="150" height="48" rx="16"/>
<text class="label" x="195.0" y="499.25" text-anchor="middle" font-size="15">它</text>
<path class="edge" d="M270 494 L600 320" marker-end="url(#arrow)"/>
<rect class="box hot" x="600" y="280" width="260" height="80" rx="16"/>
<text class="label" x="730.0" y="327.0" text-anchor="middle" font-size="20">Attention</text>
<path class="accent-edge" d="M860 320 L960 320" marker-end="url(#arrow)"/>
<rect class="box good" x="960" y="280" width="300" height="80" rx="16"/>
<text class="label" x="1110.0" y="325.6" text-anchor="middle" font-size="16">上下文相关的表示</text>
<text class="tiny" x="120" y="610" text-anchor="start">“它”指代谁，取决于它和前面所有 Token 的注意力权重，而不是位置先后。</text>
</svg>
