  </style><rect class="bg" width="1400" height="650" rx="24"/><text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text><text class="title" x="64" y="105">训练曲线与过拟合拐点</text><path class="axis" d="M160 530 H1240 M160 530 V160"/><path class="accent-edge" d="M180 210 C350 300 520 380 760 445 S1050 480 1210 492"/><path d="M180 230 C370 315 540 390 720 420 S930 390 1210 260" fill="none" stroke="#3178a5" stroke-width="4"/><line x1="760" y1="160" x2="760" y2="530" stroke="#bd852b" stroke-width="3" stroke-dasharray="10 8"/><text class="label" x="945" y="475">Training Loss</text><text class="label" x="990" y="245">Validation Loss</text><text class="label" x="780" y="190">最佳 Checkpoint</text><text class="small" x="1015" y="320">泛化开始变差</text><text class="small" x="1050" y="565">Training Step</text></svg>