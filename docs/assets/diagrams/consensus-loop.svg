<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">共识：提议、投票与让步</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">共识：提议、投票与让步</text>
<rect class="box cool" x="90" y="290" width="190" height="80" rx="16"/>
<text class="label" x="185.0" y="326.0" text-anchor="middle" font-size="18">Propose</text>
<text class="small" x="185.0" y="352.0" text-anchor="middle">提出方案</text>
<rect class="box hot" x="360" y="290" width="180" height="80" rx="16"/>
<text class="label" x="450.0" y="326.0" text-anchor="middle" font-size="18">Vote</text>
<text class="small" x="450.0" y="352.0" text-anchor="middle">各 Agent 打分</text>
<polygon class="box" points="640,260 780,330 640,400 500,330"/>
<text class="label" x="640" y="322" text-anchor="middle" font-size="16">≥ 2/3 ?</text>
<rect class="box good" x="860" y="200" width="220" height="80" rx="16"/>
<text class="label" x="970.0" y="236.0" text-anchor="middle" font-size="18">Commit</text>
<text class="small" x="970.0" y="262.0" text-anchor="middle">写入共享状态</text>
<rect class="box hot" x="860" y="430" width="220" height="80" rx="16"/>
<text class="label" x="970.0" y="466.0" text-anchor="middle" font-size="18">Negotiate</text>
<text class="small" x="970.0" y="492.0" text-anchor="middle">交换约束与让步</text>
<rect class="box cool" x="1140" y="430" width="180" height="80" rx="16"/>
<text class="label" x="1230.0" y="466.0" text-anchor="middle" font-size="18">Revise</text>
<text class="small" x="1230.0" y="492.0" text-anchor="middle">修改方案</text>
<path class="edge" d="M280 330 L360 330" marker-end="url(#arrow)"/>
<path class="edge" d="M540 330 L500 330" marker-end="url(#arrow)"/>
<path class="edge" d="M700 270 L860 240" marker-end="url(#arrow)"/>
<text class="tiny" x="760" y="250" text-anchor="start">通过</text>
<path class="edge" d="M700 390 L860 470" marker-end="url(#arrow)"/>
<text class="tiny" x="760" y="450" text-anchor="start">未通过</text>
<path class="edge" d="M1080 470 L1140 470" marker-end="url(#arrow)"/>
<path class="edge" d="M1230 430 L1230 200 L450 200 L450 290" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text class="tiny" x="760" y="190" text-anchor="start">修改后重新投票</text>
<text class="tiny" x="90" y="580" text-anchor="start">共识不是“投票简单多数”：僵局时需要让步与方案修改，否则会反复投票。</text>
</svg>
