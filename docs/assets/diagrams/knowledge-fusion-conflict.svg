<path class="edge" d="M1000 270 L1060 185" marker-end="url(#arrow)"/>
<path class="edge" d="M1000 295 L1060 285" marker-end="url(#arrow)"/>
<path class="edge" d="M1000 320 L1060 385" marker-end="url(#arrow)"/>
<text class="tiny" x="90" y="520" text-anchor="start">对齐错一个实体，后面所有融合都是错的——所以 Entity Resolution 要单独评估。</text>
