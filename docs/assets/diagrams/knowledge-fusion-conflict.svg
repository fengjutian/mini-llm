<path class="edge" d="M680 295 L760 295" marker-end="url(#arrow)"/>
<rect class="box good" x="1060" y="150" width="260" height="70" rx="16"/>
<text class="label" x="1190.0" y="191.3" text-anchor="middle" font-size="18">时间优先</text>
<rect class="box good" x="1060" y="250" width="260" height="70" rx="16"/>
<text class="label" x="1190.0" y="291.3" text-anchor="middle" font-size="18">来源可信度</text>
<rect class="box good" x="1060" y="350" width="260" height="70" rx="16"/>
