<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Shape、Stride 与连续内存</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>
    :root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}
    @media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}
  </style><rect class="bg" width="1400" height="650" rx="24"/><text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text><text class="title" x="64" y="105">Shape、Stride 与连续内存</text><rect x="100" y="200" width="90" height="78" rx="10" class="box "/><text class="label" x="145" y="247" text-anchor="middle">[0,0]</text><rect x="205" y="200" width="90" height="78" rx="10" class="box "/><text class="label" x="250" y="247" text-anchor="middle">[0,1]</text><rect x="310" y="200" width="90" height="78" rx="10" class="box "/><text class="label" x="355" y="247" text-anchor="middle">[0,2]</text><rect x="100" y="295" width="90" height="78" rx="10" class="box "/><text class="label" x="145" y="342" text-anchor="middle">[1,0]</text><rect x="205" y="295" width="90" height="78" rx="10" class="box "/><text class="label" x="250" y="342" text-anchor="middle">[1,1]</text><rect x="310" y="295" width="90" height="78" rx="10" class="box hot"/><text class="label" x="355" y="342" text-anchor="middle">[1,2]</text><text class="small" x="100" y="414">Shape = [2, 3] · Stride = [3, 1]</text><path class="accent-edge" d="M430 285 L680 285" marker-end="url(#arrow)"/><rect x="720" y="246" width="78" height="76" rx="8" class="box "/><text class="label" x="759" y="292" text-anchor="middle">0</text><rect x="812" y="246" width="78" height="76" rx="8" class="box "/><text class="label" x="851" y="292" text-anchor="middle">1</text><rect x="904" y="246" width="78" height="76" rx="8" class="box "/><text class="label" x="943" y="292" text-anchor="middle">2</text><rect x="996" y="246" width="78" height="76" rx="8" class="box "/><text class="label" x="1035" y="292" text-anchor="middle">3</text><rect x="1088" y="246" width="78" height="76" rx="8" class="box "/><text class="label" x="1127" y="292" text-anchor="middle">4</text><rect x="1180" y="246" width="78" height="76" rx="8" class="box hot"/><text class="label" x="1219" y="292" text-anchor="middle">5</text><text class="small" x="720" y="370">offset = row × 3 + col × 1</text><text class="small" x="100" y="168">逻辑索引</text><text class="small" x="720" y="215">物理 Storage</text></svg>