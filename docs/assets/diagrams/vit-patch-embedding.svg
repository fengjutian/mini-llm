<rect class="box cool" x="132" y="222" width="40" height="40" rx="3"/>
<rect class="box cool" x="174" y="222" width="40" height="40" rx="3"/>
<rect class="box cool" x="216" y="222" width="40" height="40" rx="3"/>
<rect class="box cool" x="90" y="264" width="40" height="40" rx="3"/>
<rect class="box cool" x="132" y="264" width="40" height="40" rx="3"/>
<rect class="box cool" x="174" y="264" width="40" height="40" rx="3"/>
