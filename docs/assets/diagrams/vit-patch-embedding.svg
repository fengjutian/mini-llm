<path class="edge" d="M860 262 L940 262" marker-end="url(#arrow)"/>
<rect class="box good" x="940" y="200" width="180" height="124" rx="16"/>
<text class="label" x="1030.0" y="268.3" text-anchor="middle" font-size="18">+ Position Embedding</text>
<path class="accent-edge" d="M1120 262 L1190 262" marker-end="url(#arrow)"/>
<rect class="box hot" x="1190" y="200" width="140" height="124" rx="16"/>
<text class="label" x="1260.0" y="268.3" text-anchor="middle" font-size="18">Transformer</text>
<text class="tiny" x="90" y="560" text-anchor="start">Patch 是图像的“Token”：切得越细，序列越长，计算量按平方增长。</text>
</svg>
