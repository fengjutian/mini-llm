<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740" role="img" aria-labelledby="t d"><title id="t">梯形速度轨迹</title><desc id="d">位置、速度和加速度随时间的对应曲线。</desc><style>.b{fill:#f7f4ed}.ax{stroke:#69777d;stroke-width:2}.po{fill:none;stroke:#3178a5;stroke-width:6}.v{fill:none;stroke:#4f8b62;stroke-width:6}.a{fill:none;stroke:#e45d32;stroke-width:6}.ds{stroke:#bd852b;stroke-width:2;stroke-dasharray:8 7}.tx{fill:#172126;font:600 18px Inter,"Microsoft YaHei",sans-serif}.sm{fill:#69777d;font:15px Inter,"Microsoft YaHei",sans-serif}.ph{fill:#bd852b;opacity:.08}@media(prefers-color-scheme:dark){.b{fill:#101416}.ax{stroke:#3c484e}.tx{fill:#edf2f3}.sm{fill:#a8b4b9}}</style><rect class="b" width="1400" height="740" rx="24"/><text class="tx" x="60" y="58" font-size="30">路径加上时间参数，才成为可执行轨迹</text><rect class="ph" x="150" y="95" width="300" height="570"/><rect class="ph" x="980" y="95" width="270" height="570"/><path class="ds" d="M450 95V665M980 95V665"/><text class="sm" x="270" y="88">加速</text><text class="sm" x="700" y="88">匀速</text><text class="sm" x="1080" y="88">减速</text><path class="ax" d="M150 270H1260M150 270V120M150 475H1260M150 475V325M150 665H1260M150 665V520"/><text class="tx" x="65" y="195">位置 q</text><text class="tx" x="65" y="400">速度 q̇</text><text class="tx" x="65" y="590">加速度 q̈</text><path class="po" d="M150 265C245 263 355 250 450 210L980 135C1080 120 1175 115 1250 115"/><path class="v" d="M150 470L450 340H980L1250 470"/><path class="a" d="M150 650V540H450V600H980V650H1250V600"/><text class="sm" x="470" y="710">约束 |q̇| ≤ v_max、|q̈| ≤ a_max；限制 jerk 时还需平滑加速度拐角</text></svg>
