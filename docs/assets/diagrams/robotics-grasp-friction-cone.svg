<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="t d"><title id="t">双指抓取接触力与摩擦锥</title><desc id="d">法向力、摩擦力、重力和摩擦锥约束。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="currentColor"/></marker></defs><style>.b{fill:#f7f4ed}.o{fill:#eaf3f7;stroke:#3178a5;stroke-width:4}.f{fill:#d7d0c5;stroke:#69777d;stroke-width:3}.n{stroke:#e45d32;stroke-width:6;marker-end:url(#a)}.fr{stroke:#4f8b62;stroke-width:6;marker-end:url(#a)}.gr{stroke:#bd852b;stroke-width:6;marker-end:url(#a)}.c{fill:#4f8b62;opacity:.14;stroke:#4f8b62;stroke-width:3}.tx{fill:#172126;font:600 18px Inter,"Microsoft YaHei",sans-serif}.sm{fill:#69777d;font:16px Inter,"Microsoft YaHei",sans-serif}.p{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.m{fill:#172126;font:23px Cambria,serif}@media(prefers-color-scheme:dark){.b{fill:#101416}.o{fill:#172934}.f{fill:#3d464a}.tx,.m{fill:#edf2f3}.sm{fill:#a8b4b9}.p{fill:#182024}}</style><rect class="b" width="1400" height="700" rx="24"/><text class="tx" x="60" y="58" font-size="30">稳定抓取取决于力，而不只是夹爪位置</text><rect class="f" x="130" y="220" width="140" height="300" rx="28"/><rect class="f" x="690" y="220" width="140" height="300" rx="28"/><rect class="o" x="325" y="165" width="310" height="400" rx="42"/><path class="c" d="M325 420L250 275L400 275Z"/><path class="c" d="M635 420L560 275L710 275Z"/><path class="n" d="M230 365H390"/><path class="n" d="M730 365H570"/><path class="fr" d="M325 420V290"/><path class="fr" d="M635 420V290"/><path class="gr" d="M480 320V500"/><text class="tx" x="255" y="340">N₁</text><text class="tx" x="675" y="340">N₂</text><text class="tx" x="500" y="490">mg</text>
<rect class="p" x="900" y="145" width="430" height="410" rx="20"/><text class="tx" x="945" y="205" font-size="23">库仑摩擦约束</text><text class="m" x="945" y="260">|fₜ| ≤ μN</text><text class="sm" x="945" y="302">接触力必须落在摩擦锥内部</text><path d="M945 335H1290" stroke="#c4bdb1"/><text class="tx" x="945" y="385" font-size="23">竖直静态平衡</text><text class="m" x="945" y="440">fₜ₁ + fₜ₂ ≥ mg</text><text class="sm" x="945" y="485">过松会滑落，过紧可能损坏物体</text><text class="sm" x="945" y="520">结合触觉 / 力传感反馈调整 N</text></svg>
