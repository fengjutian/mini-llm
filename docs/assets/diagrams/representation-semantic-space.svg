  </style><rect class="bg" width="1400" height="650" rx="24"/><text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text><text class="title" x="64" y="105">语义空间中的局部几何</text><path class="axis" d="M120 535 H1270 M120 535 V155"/><circle class="dot" cx="250" cy="260" r="12" fill="#e45d32"/><text class="small" x="268" y="265">猫</text><circle class="dot" cx="320" cy="220" r="12" fill="#e45d32"/><text class="small" x="338" y="225">狗</text><circle class="dot" cx="285" cy="330" r="12" fill="#e45d32"/><text class="small" x="303" y="335">宠物</text><circle class="dot" cx="630" cy="240" r="12" fill="#4f8b62"/><text class="small" x="648" y="245">苹果</text><circle class="dot" cx="700" cy="290" r="12" fill="#4f8b62"/><text class="small" x="718" y="295">香蕉</text><circle class="dot" cx="665" cy="350" r="12" fill="#4f8b62"/><text class="small" x="683" y="355">水果</text><circle class="dot" cx="1010" cy="230" r="12" fill="#3178a5"/><text class="small" x="1028" y="235">汽车</text><circle class="dot" cx="1080" cy="300" r="12" fill="#3178a5"/><text class="small" x="1098" y="305">火车</text><circle class="dot" cx="1000" cy="360" r="12" fill="#3178a5"/><text class="small" x="1018" y="365">交通</text><path d="M300 390 C260 355 220 250 300 185 C375 150 410 300 350 380 Z" fill="#e45d32" class="area"/><path d="M650 400 C570 330 600 190 710 185 C790 260 755 380 650 400 Z" fill="#4f8b62" class="area"/><path d="M1010 410 C930 330 950 180 1090 190 C1160 290 1120 390 1010 410 Z" fill="#3178a5" class="area"/><text class="small" x="1090" y="570">语义方向 →</text></svg>