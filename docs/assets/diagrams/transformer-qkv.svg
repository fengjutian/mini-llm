<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Q / K / V 与注意力计算</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">Q / K / V 与注意力计算</text>
<rect class="box hot" x="60" y="280" width="120" height="70" rx="16"/>
<text class="label" x="120.0" y="322.0" text-anchor="middle" font-size="20">X</text>
<rect class="box cool" x="240" y="180" width="100" height="64" rx="16"/>
<text class="label" x="290.0" y="217.6" text-anchor="middle" font-size="16">Wq</text>
<path class="edge" d="M180 315 L240 212" marker-end="url(#arrow)"/>
<rect class="box cool" x="240" y="280" width="100" height="64" rx="16"/>
<text class="label" x="290.0" y="317.6" text-anchor="middle" font-size="16">Wk</text>
<path class="edge" d="M180 315 L240 312" marker-end="url(#arrow)"/>
<rect class="box cool" x="240" y="380" width="100" height="64" rx="16"/>
<text class="label" x="290.0" y="417.6" text-anchor="middle" font-size="16">Wv</text>
<path class="edge" d="M180 315 L240 412" marker-end="url(#arrow)"/>
<rect class="box good" x="400" y="180" width="90" height="64" rx="16"/>
<text class="label" x="445.0" y="218.3" text-anchor="middle" font-size="18">Q</text>
<path class="edge" d="M340 212 L400 212" marker-end="url(#arrow)"/>
<rect class="box good" x="400" y="280" width="90" height="64" rx="16"/>
<text class="label" x="445.0" y="318.3" text-anchor="middle" font-size="18">K</text>
<path class="edge" d="M340 312 L400 312" marker-end="url(#arrow)"/>
<rect class="box good" x="400" y="380" width="90" height="64" rx="16"/>
<text class="label" x="445.0" y="418.3" text-anchor="middle" font-size="18">V</text>
<path class="edge" d="M340 412 L400 412" marker-end="url(#arrow)"/>
<rect class="box cool" x="560" y="280" width="150" height="70" rx="16"/>
<text class="label" x="635.0" y="320.6" text-anchor="middle" font-size="16">QKᵀ / √d</text>
<path class="edge" d="M490 212 L560 300" marker-end="url(#arrow)"/>
<path class="edge" d="M490 312 L560 312" marker-end="url(#arrow)"/>
<rect class="box cool" x="770" y="280" width="140" height="70" rx="16"/>
<text class="label" x="840.0" y="321.3" text-anchor="middle" font-size="18">softmax</text>
<path class="edge" d="M710 315 L770 315" marker-end="url(#arrow)"/>
<rect class="box cool" x="960" y="280" width="150" height="70" rx="16"/>
<text class="label" x="1035.0" y="321.3" text-anchor="middle" font-size="18">× V</text>
<path class="edge" d="M910 315 L960 315" marker-end="url(#arrow)"/>
<path class="edge" d="M490 412 L960 350" marker-end="url(#arrow)"/>
<rect class="box good" x="1160" y="280" width="160" height="70" rx="16"/>
<text class="label" x="1240.0" y="321.3" text-anchor="middle" font-size="18">输出</text>
<path class="edge" d="M1110 315 L1160 315" marker-end="url(#arrow)"/>
<text class="tiny" x="60" y="560" text-anchor="start">多头注意力只是把这一套计算并行做 h 次，再把结果拼回去。</text>
</svg>
