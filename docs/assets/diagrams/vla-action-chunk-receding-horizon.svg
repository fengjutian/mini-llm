<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img"><style>.b{fill:#f7f4ed}.ax{stroke:#69777d;stroke-width:2}.c1{fill:#3178a5}.c2{fill:#4f8b62}.c3{fill:#bd852b}.f{opacity:.25}.ex{stroke:#e45d32;stroke-width:4}.tx{fill:#172126;font:600 18px Inter,"Microsoft YaHei",sans-serif}.sm{fill:#69777d;font:15px Inter,"Microsoft YaHei",sans-serif}@media(prefers-color-scheme:dark){.b{fill:#101416}.ax{stroke:#526168}.tx{fill:#edf2f3}.sm{fill:#a8b4b9}}</style><rect class="b" width="1400" height="650" rx="24"/><text class="tx" x="60" y="58" font-size="30">预测 H 步，只执行 K 步，再用新观测滚动更新</text><path class="ax" d="M120 535H1300"/><text class="tx" x="120" y="145">第 1 次预测</text><text class="tx" x="120" y="285">第 2 次预测</text><text class="tx" x="120" y="425">第 3 次预测</text><g><rect class="c1" x="340" y="105" width="90" height="70" rx="10"/><rect class="c1" x="440" y="105" width="90" height="70" rx="10"/><rect class="c1 f" x="540" y="105" width="290" height="70" rx="10"/><rect class="c2" x="540" y="245" width="90" height="70" rx="10"/><rect class="c2" x="640" y="245" width="90" height="70" rx="10"/><rect class="c2 f" x="740" y="245" width="290" height="70" rx="10"/><rect class="c3" x="740" y="385" width="90" height="70" rx="10"/><rect class="c3" x="840" y="385" width="90" height="70" rx="10"/><rect class="c3 f" x="940" y="385" width="290" height="70" rx="10"/></g><path class="ex" d="M335 190H535M535 330H735M735 470H935"/><text class="sm" x="350" y="215">执行 K=2</text><text class="sm" x="550" y="355">新观测后重算</text><text class="sm" x="750" y="495">继续滚动</text><text class="sm" x="860" y="595">实色：实际执行　淡色：候选未来</text></svg>
