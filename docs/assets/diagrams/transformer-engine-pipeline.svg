<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Transformer Engine 的整体流水线</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">Transformer Engine 的整体流水线</text>
<rect class="box hot" x="140" y="120" width="300" height="48" rx="16"/>
<text class="label" x="290.0" y="149.25" text-anchor="middle" font-size="15">文本</text>
<path class="edge" d="M290 168 L290 182" marker-end="url(#arrow)"/>
<rect class="box cool" x="140" y="182" width="300" height="48" rx="16"/>
<text class="label" x="290.0" y="211.25" text-anchor="middle" font-size="15">Tokenizer</text>
<path class="edge" d="M290 230 L290 244" marker-end="url(#arrow)"/>
<rect class="box cool" x="140" y="244" width="300" height="48" rx="16"/>
<text class="label" x="290.0" y="273.25" text-anchor="middle" font-size="15">Token IDs</text>
<path class="edge" d="M290 292 L290 306" marker-end="url(#arrow)"/>
<rect class="box cool" x="140" y="306" width="300" height="48" rx="16"/>
<text class="label" x="290.0" y="335.25" text-anchor="middle" font-size="15">Embedding</text>
<path class="edge" d="M290 354 L290 368" marker-end="url(#arrow)"/>
<rect class="box cool" x="140" y="368" width="300" height="48" rx="16"/>
<text class="label" x="290.0" y="397.25" text-anchor="middle" font-size="15">+ Positional Encoding</text>
<rect class="box hot" x="560" y="120" width="360" height="210" rx="16"/>
<text class="label" x="590" y="158" text-anchor="start" font-size="17">Transformer Block</text>
<text class="small" x="590" y="198" text-anchor="start">· Self-Attention</text>
<text class="small" x="590" y="230" text-anchor="start">· Add &amp; Norm</text>
<text class="small" x="590" y="262" text-anchor="start">· FFN</text>
<text class="small" x="590" y="294" text-anchor="start">· Add &amp; Norm</text>
<path class="edge" d="M440 250 L560 250" marker-end="url(#arrow)"/>
<rect class="box cool" x="560" y="380" width="360" height="54" rx="16"/>
<text class="label" x="740.0" y="412.25" text-anchor="middle" font-size="15">下一层 Block …</text>
<path class="edge" d="M740 330 L740 380" marker-end="url(#arrow)"/>
<rect class="box good" x="560" y="470" width="360" height="54" rx="16"/>
<text class="label" x="740.0" y="502.6" text-anchor="middle" font-size="16">最终隐藏状态</text>
<path class="edge" d="M740 434 L740 470" marker-end="url(#arrow)"/>
<text class="tiny" x="70" y="600" text-anchor="start">Attention 管“看哪里”，FFN 管“怎么变换”，Add &amp; Norm 保证信号能穿过很多层。</text>
</svg>
