<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">一条训练样本的完整路径</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">一条训练样本的完整路径</text>
<rect class="box cool" x="90" y="180" width="200" height="62" rx="16"/>
<text class="label" x="190.0" y="216.25" text-anchor="middle" font-size="15">训练文本</text>
<path class="edge" d="M290 211 L340 211" marker-end="url(#arrow)"/>
<rect class="box cool" x="340" y="180" width="200" height="62" rx="16"/>
<text class="label" x="440.0" y="216.25" text-anchor="middle" font-size="15">Tokenizer</text>
<path class="edge" d="M540 211 L590 211" marker-end="url(#arrow)"/>
<rect class="box cool" x="590" y="180" width="200" height="62" rx="16"/>
<text class="label" x="690.0" y="216.25" text-anchor="middle" font-size="15">Input IDs</text>
<path class="edge" d="M790 211 L840 211" marker-end="url(#arrow)"/>
<rect class="box hot" x="840" y="180" width="200" height="62" rx="16"/>
<text class="label" x="940.0" y="216.25" text-anchor="middle" font-size="15">Decoder Model</text>
<path class="edge" d="M1040 211 L1090 211" marker-end="url(#arrow)"/>
<rect class="box cool" x="1090" y="180" width="200" height="62" rx="16"/>
<text class="label" x="1190.0" y="216.25" text-anchor="middle" font-size="15">Logits</text>
<line class="axis" x1="1290" y1="242" x2="1310" y2="280"/>
<line class="axis" x1="1310" y1="280" x2="70" y2="280"/>
<path class="edge" d="M70 280 L70 380" marker-end="url(#arrow)"/>
<rect class="box cool" x="90" y="380" width="200" height="62" rx="16"/>
<text class="label" x="190.0" y="416.25" text-anchor="middle" font-size="15">Cross Entropy</text>
<path class="edge" d="M290 411 L340 411" marker-end="url(#arrow)"/>
<rect class="box hot" x="340" y="380" width="200" height="62" rx="16"/>
<text class="label" x="440.0" y="416.25" text-anchor="middle" font-size="15">Backward</text>
<path class="edge" d="M540 411 L590 411" marker-end="url(#arrow)"/>
<rect class="box cool" x="590" y="380" width="200" height="62" rx="16"/>
<text class="label" x="690.0" y="416.25" text-anchor="middle" font-size="15">Gradient</text>
<path class="edge" d="M790 411 L840 411" marker-end="url(#arrow)"/>
<rect class="box cool" x="840" y="380" width="200" height="62" rx="16"/>
<text class="label" x="940.0" y="416.25" text-anchor="middle" font-size="15">Optimizer</text>
<path class="edge" d="M1040 411 L1090 411" marker-end="url(#arrow)"/>
<rect class="box cool" x="1090" y="380" width="200" height="62" rx="16"/>
<text class="label" x="1190.0" y="416.25" text-anchor="middle" font-size="15">更新参数</text>
<text class="tiny" x="90" y="560" text-anchor="start">前向算 loss，反向算梯度，优化器更新参数——一个 step 就这么结束。</text>
<text class="tiny" x="90" y="600" text-anchor="start">训练循环 = 这条路径重复 batch_size × steps 次。</text>
</svg>
