<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">执行图、检查点与恢复</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>:root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.tiny{fill:#69777d;font:500 13px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}@media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.tiny{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}</style>
  <rect class="bg" width="1400" height="650" rx="24"/>
  <text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text>
  <text class="title" x="64" y="105">执行图、检查点与恢复</text>
<rect class="box hot" x="70" y="230" width="150" height="70" rx="16"/>
<text class="label" x="145.0" y="271.3" text-anchor="middle" font-size="18">Task A</text>
<rect class="box cool" x="280" y="140" width="150" height="70" rx="16"/>
<text class="label" x="355.0" y="181.3" text-anchor="middle" font-size="18">Task B</text>
<rect class="box cool" x="280" y="320" width="150" height="70" rx="16"/>
<text class="label" x="355.0" y="361.3" text-anchor="middle" font-size="18">Task C</text>
<rect class="box hot" x="500" y="230" width="150" height="70" rx="16"/>
<text class="label" x="575.0" y="271.3" text-anchor="middle" font-size="18">Task D</text>
<rect class="box" x="720" y="230" width="150" height="70" rx="16"/>
<text class="label" x="795.0" y="271.3" text-anchor="middle" font-size="18">Task E</text>
<rect class="box good" x="940" y="230" width="170" height="70" rx="16"/>
<text class="label" x="1025.0" y="271.3" text-anchor="middle" font-size="18">完成</text>
<path class="edge" d="M220 265 L280 185" marker-end="url(#arrow)"/>
<path class="edge" d="M220 265 L280 355" marker-end="url(#arrow)"/>
<path class="edge" d="M430 175 L500 245" marker-end="url(#arrow)"/>
<path class="edge" d="M430 355 L500 285" marker-end="url(#arrow)"/>
<path class="edge" d="M650 265 L720 265" marker-end="url(#arrow)"/>
<path class="edge" d="M870 265 L940 265" marker-end="url(#arrow)"/>
<text class="tiny" x="520" y="180" text-anchor="start">checkpoint</text>
<text class="tiny" x="300" y="120" text-anchor="start">checkpoint</text>
<rect class="box hot" x="520" y="420" width="200" height="68" rx="16"/>
<text class="label" x="620.0" y="459.6" text-anchor="middle" font-size="16">worker 崩溃</text>
<path class="accent-edge" d="M620 420 L600 300" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text class="tiny" x="520" y="530" text-anchor="start">从 D 的检查点恢复：A–C 不重跑</text>
<text class="tiny" x="70" y="600" text-anchor="start">检查点不是“保存状态”，而是“让已完成的工作不必再做一遍”。</text>
</svg>
