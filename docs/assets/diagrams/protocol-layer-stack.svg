  </style><rect class="bg" width="1400" height="650" rx="24"/><text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text><text class="title" x="64" y="105">Protocol Engine 分层</text><rect class="box hot" x="220" y="155" width="960" height="64" rx="16"/><text class="label" x="700" y="194" text-anchor="middle">A2A · Agent Communication</text><rect class="box cool" x="270" y="245" width="860" height="64" rx="16"/><text class="label" x="700" y="284" text-anchor="middle">MCP · Context / Resource / Tool</text><rect class="box normal" x="320" y="335" width="760" height="64" rx="16"/><text class="label" x="700" y="374" text-anchor="middle">Tool Calling · Function Schema</text><rect class="box good" x="370" y="425" width="660" height="64" rx="16"/><text class="label" x="700" y="464" text-anchor="middle">Message Bus · Transport</text><text class="small" x="485" y="535">上层表达协作语义，下层负责消息传输与可靠交付</text></svg>