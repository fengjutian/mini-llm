  </style><rect class="bg" width="1400" height="650" rx="24"/><text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text><text class="title" x="64" y="105">训练循环与 Loss 收敛</text><rect class="box normal" x="70" y="210" width="160" height="70" rx="16"/><text class="label" x="150" y="252" text-anchor="middle">Batch</text><rect class="box cool" x="280" y="210" width="160" height="70" rx="16"/><text class="label" x="360" y="252" text-anchor="middle">Forward</text><rect class="box hot" x="490" y="210" width="160" height="70" rx="16"/><text class="label" x="570" y="252" text-anchor="middle">Loss</text><rect class="box normal" x="700" y="210" width="160" height="70" rx="16"/><text class="label" x="780" y="252" text-anchor="middle">Backward</text><rect class="box good" x="910" y="210" width="160" height="70" rx="16"/><text class="label" x="990" y="252" text-anchor="middle">AdamW</text><path class="edge" d="M230 245 L280 245" marker-end="url(#arrow)"/><path class="edge" d="M440 245 L490 245" marker-end="url(#arrow)"/><path class="edge" d="M650 245 L700 245" marker-end="url(#arrow)"/><path class="edge" d="M860 245 L910 245" marker-end="url(#arrow)"/><path class="accent-edge" d="M990 280 L150 360" marker-end="url(#arrow)"/><path class="axis" d="M760 530 H1290 M760 530 V340"/><path class="accent-edge" d="M780 370 C900 390 960 455 1080 470 S1220 493 1270 500"/><text class="small" x="760" y="325">Loss</text><text class="small" x="1240" y="565">Step</text><text class="small" x="70" y="400">下一批数据</text></svg>