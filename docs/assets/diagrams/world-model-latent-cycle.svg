  </style><rect class="bg" width="1400" height="650" rx="24"/><text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text><text class="title" x="64" y="105">潜在动力学循环</text><rect class="box cool" x="70" y="260" width="210" height="80" rx="16"/><text class="label" x="175" y="307" text-anchor="middle">Observation oₜ</text><rect class="box normal" x="370" y="260" width="180" height="80" rx="16"/><text class="label" x="460" y="307" text-anchor="middle">Encoder</text><rect class="box hot" x="650" y="260" width="210" height="80" rx="16"/><text class="label" x="755" y="307" text-anchor="middle">Latent zₜ</text><rect class="box normal" x="950" y="160" width="220" height="75" rx="16"/><text class="label" x="1060" y="204.5" text-anchor="middle">Dynamics</text><rect class="box normal" x="950" y="390" width="220" height="75" rx="16"/><text class="label" x="1060" y="434.5" text-anchor="middle">Decoder</text><path class="edge" d="M280 300 L370 300" marker-end="url(#arrow)"/><path class="edge" d="M550 300 L650 300" marker-end="url(#arrow)"/><path class="accent-edge" d="M860 280 L950 198" marker-end="url(#arrow)"/><path class="accent-edge" d="M1060 235 L760 260" marker-end="url(#arrow)"/><path class="edge" d="M860 320 L950 427" marker-end="url(#arrow)"/><path class="edge" d="M1170 427 L1280 427" marker-end="url(#arrow)"/><text class="small" x="1200" y="420">Prediction</text><text class="small" x="910" y="125">在低维潜在空间滚动</text></svg>