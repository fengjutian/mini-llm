<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">状态空间搜索与剪枝</title><desc id="desc">mini-llm 技术机制图</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker></defs>
  <style>
    :root{color-scheme:light dark}.bg{fill:#f7f4ed}.title{fill:#172126;font:700 30px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.kicker{fill:#e45d32;font:700 16px ui-monospace,Consolas,monospace;letter-spacing:2px}.box{fill:#fffdf8;stroke:#c4bdb1;stroke-width:2}.box.hot{fill:#fff0e8;stroke:#e45d32}.box.cool{fill:#eaf3f7;stroke:#3178a5}.box.good{fill:#eaf4ec;stroke:#4f8b62}.label{fill:#172126;font:650 18px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{fill:#69777d;font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.edge{color:#69777d;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.accent-edge{color:#e45d32;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.axis{fill:none;stroke:#69777d;stroke-width:2}.grid{stroke:#c4bdb1;stroke-width:1;opacity:.45}.dot{stroke:#fffdf8;stroke-width:3}.area{opacity:.14}
    @media(prefers-color-scheme:dark){.bg{fill:#101416}.title,.label{fill:#edf2f3}.kicker{fill:#ef855d}.box{fill:#182024;stroke:#526168}.box.hot{fill:#32211c;stroke:#e17750}.box.cool{fill:#172934;stroke:#4d91bc}.box.good{fill:#192b20;stroke:#65a779}.small{fill:#a8b4b9}.grid{stroke:#3c484e}.dot{stroke:#101416}}
  </style><rect class="bg" width="1400" height="650" rx="24"/><text class="kicker" x="64" y="58">MINI-LLM · MECHANISM</text><text class="title" x="64" y="105">状态空间搜索与剪枝</text><rect class="box hot" x="600" y="155" width="180" height="64" rx="16"/><text class="label" x="690" y="194" text-anchor="middle">S₀</text><rect class="box normal" x="250" y="290" width="170" height="64" rx="16"/><text class="label" x="335" y="329" text-anchor="middle">S₁</text><rect class="box good" x="615" y="290" width="170" height="64" rx="16"/><text class="label" x="700" y="329" text-anchor="middle">S₂</text><rect class="box normal" x="980" y="290" width="170" height="64" rx="16"/><text class="label" x="1065" y="329" text-anchor="middle">S₃</text><rect class="box normal" x="120" y="440" width="150" height="60" rx="16"/><text class="label" x="195" y="477" text-anchor="middle">S₄</text><rect class="box normal" x="360" y="440" width="150" height="60" rx="16"/><text class="label" x="435" y="477" text-anchor="middle">S₅</text><rect class="box good" x="600" y="440" width="150" height="60" rx="16"/><text class="label" x="675" y="477" text-anchor="middle">Goal</text><rect class="box normal" x="850" y="440" width="150" height="60" rx="16"/><text class="label" x="925" y="477" text-anchor="middle">Pruned</text><rect class="box normal" x="1090" y="440" width="150" height="60" rx="16"/><text class="label" x="1165" y="477" text-anchor="middle">S₈</text><path class="edge" d="M650 219 L335 290"/><path class="accent-edge" d="M690 219 L700 290"/><path class="edge" d="M730 219 L1065 290"/><path class="edge" d="M300 354 L195 440"/><path class="edge" d="M370 354 L435 440"/><path class="accent-edge" d="M680 354 L675 440"/><path d="M850 440 L1000 500 M1000 440 L850 500" stroke="#e45d32" stroke-width="5"/><path class="edge" d="M1065 354 L1165 440"/><text class="small" x="600" y="555">高价值路径</text></svg>